<style>
.mascot-gallery-page {
  padding: 164px 0 112px;
}
.mascot-gallery-inner {
  padding-inline: 28px;
}
.mascot-gallery-back {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 34px;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  transition: color 0.2s var(--ease), transform 0.2s var(--ease);
}
.mascot-gallery-back::before {
  content: '';
  width: 18px;
  height: 10px;
  background: currentColor;
  clip-path: polygon(0 50%, 42% 0, 42% 38%, 100% 38%, 100% 62%, 42% 62%, 42% 100%);
  flex: 0 0 auto;
}
.mascot-gallery-back:hover {
  color: var(--accent);
  transform: translateX(-4px);
}
.mascot-gallery-hero {
  display: grid;
  grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr);
  align-items: stretch;
  overflow: hidden;
  background: linear-gradient(135deg, #fff0bf 0%, #ffe3a0 56%, #ffd27a 100%);
}
.mascot-gallery-copy {
  padding: 44px 40px;
}
.mascot-gallery-copy h1 {
  margin: 0 0 16px;
  color: #111111;
  font-family: var(--font-display);
  font-size: clamp(38px, 5vw, 64px);
  font-weight: 400;
  line-height: 1.02;
}
.mascot-gallery-copy p {
  max-width: 520px;
  margin: 0 0 12px;
  color: #3f4354;
  font-size: 16px;
  line-height: 1.55;
}
.mascot-gallery-note {
  display: inline-flex;
  margin-top: 18px;
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.54);
  color: #111111;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mascot-gallery-media img {
  width: 100%;
  height: 100%;
  min-height: 380px;
  object-fit: cover;
  display: block;
}
@media (max-width: 900px) {
  .mascot-gallery-inner {
    padding-inline: 24px;
  }
  .mascot-gallery-hero {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 768px) {
  .mascot-gallery-page {
    padding: 132px 0 88px;
  }
  .mascot-gallery-inner {
    padding-inline: 18px;
  }
  .mascot-gallery-copy {
    padding: 28px 20px;
  }
  .mascot-gallery-copy p {
    font-size: 15px;
  }
  .mascot-gallery-media img {
    min-height: 240px;
  }
}
</style>

        <a class="mascot-gallery-back reveal" href="work.html">Back to work</a>
        <div class="mascot-gallery-hero">
          <div class="mascot-gallery-copy reveal">
            <h1>Mascot Gallery</h1>
            <p>A curated collection of mascot characters, brand personalities, and playful visual assets.</p>
            <p>This page is ready for your final mascot images and project entries. Once you send them, we can turn this into the full gallery.</p>
            <span class="mascot-gallery-note">Gallery Coming Soon</span>
          </div>
          <div class="mascot-gallery-media reveal reveal-delay-1">
            <img src="santa-images/santa-barbara-cafe-mascot-suit-design.webp" alt="Mascot character gallery preview artwork" loading="lazy" decoding="async">
          </div>
        </div>
      </div>
    </section>
