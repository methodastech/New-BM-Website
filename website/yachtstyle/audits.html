<head>
<meta charset="utf-8">

<style>
  :root{--sbw:var(--sbw-open,256px);--bh:66px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,sans-serif;color:#0B1826;background:#0A0B0E;-webkit-font-smoothing:antialiased;overflow:hidden}
  .bmws{position:fixed;top:0;left:0;right:0;z-index:60}
  .sb{position:fixed;left:0;top:var(--bh);bottom:0;width:var(--sbw);z-index:50}
  .doc{position:fixed;top:var(--bh);right:0;bottom:0;left:var(--sbw);background:#fff}
  .doc iframe{display:block;width:100%;height:100%;border:0;background:#fff}
  @media(min-width:1100px){html.sb-off{--sbw:56px}}
  @media(max-width:1099px){
    .sb{bottom:auto;right:0;width:auto}
    .doc{left:0;top:calc(var(--bh) + 50px)}
  }

/* ---- the workspace side bar, one look on every page (lirunex_sidebar.py, 28 Oct 2026, round 2) ---- */
.sb{display:flex;flex-direction:column;padding:0;background:#0A0B0E;color:#fff;color-scheme:dark;border:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset -1px 0 0 rgba(255,255,255,.07);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.sb-top{flex:none;display:grid;grid-template-columns:minmax(0,1fr) 32px;column-gap:8px;align-items:start;padding:12px 10px 14px 18px}
.sb-id{min-width:0;padding-top:6px}
.sb-id b{display:block;font:600 14px/20px "Inter Tight",Inter,system-ui,sans-serif;letter-spacing:-.006em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sub{grid-column:1/-1;margin:4px 8px 0 0;font:400 13px/18px Inter,system-ui,sans-serif;letter-spacing:0;color:rgba(255,255,255,.48);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sb-tg{display:grid;place-items:center;width:32px;height:32px;margin:0;padding:0;border:0;border-radius:3px;background:none;color:rgba(255,255,255,.46);cursor:pointer;transition:color .15s,background .15s}
.sb-tg:hover{color:#fff;background:rgba(255,255,255,.07)}
.sb-tg .ic{width:18px;height:18px}
.sb-tg .ic-open{display:none}
.sb-nav{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;padding:0 10px 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
.sb-nav ol{list-style:none;margin:0;padding:0}
.sb-part{display:block;margin:0;padding:16px 8px 4px;font:500 13px/18px Inter,system-ui,sans-serif;letter-spacing:0;color:rgba(255,255,255,.46)}
.sb-part:first-child{padding-top:2px}
.sb .si{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:32px;margin:0 0 1px;padding:6px 8px;border:0;border-radius:3px;background:none;text-align:left;
  font:500 14px/20px Inter,system-ui,sans-serif;letter-spacing:-.003em;color:rgba(255,255,255,.62);text-decoration:none;cursor:pointer;position:relative;transition:color .12s,background .12s}
.sb .si .ic{width:18px;height:18px;margin-top:1px;color:rgba(255,255,255,.44);transition:color .12s}
.sb .si:hover{color:rgba(255,255,255,.92);background:rgba(255,255,255,.045)}
.sb .si:hover .ic{color:rgba(255,255,255,.72)}
.sb .si.on,.sb .si[aria-current]:not([aria-current="false"]){color:#fff;background:rgba(255,255,255,.085)}
.sb .si.on .ic,.sb .si[aria-current]:not([aria-current="false"]) .ic{color:#fff}
.sb .si .lb{flex:1;min-width:0}
.sb .si .ct{flex:none;margin-left:auto;min-width:20px;height:auto;padding:0;text-align:right;font:500 13px/20px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.46);background:none}
.sb .si .ct.alert{min-width:22px;padding:0 6px;border-radius:3px;text-align:center;background:#fff;color:#0A0B0E;font-weight:600}
.sb .ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:1}
.sb .ic *{vector-effect:non-scaling-stroke}
.sb-foot{flex:none;padding:8px 10px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.sb-note{margin:0;padding:6px 8px 6px;font:400 14px/21px Inter,system-ui,sans-serif;color:rgba(255,255,255,.5)}
/* focus: nothing on a click; a quiet ring on the keyboard, inside the rounded row */
.sb a:focus,.sb button:focus,.sb-rz:focus,.split-rz:focus{outline:none}
.sb a:focus-visible,.sb button:focus-visible{outline:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
html[data-lx-input="pointer"] .sb a:focus-visible,html[data-lx-input="pointer"] .sb button:focus-visible{box-shadow:none}
/* the resize handles: a hairline that shows on hover, brighter while dragging or focused */
.sb-rz,.split-rz{position:absolute;top:0;bottom:0;width:10px;z-index:6;cursor:col-resize;touch-action:none;background:none}
.sb-rz{right:-5px}
.split-rz{left:-5px}
.sb-rz::after,.split-rz::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:2px;background:transparent;transition:background .15s .08s}
.sb-rz:hover::after,.split-rz:hover::after{background:rgba(255,255,255,.24)}
.sb-rz.drag::after,.split-rz.drag::after,.sb-rz:focus-visible::after,.split-rz:focus-visible::after{background:rgba(255,255,255,.7);transition:none}
html.lx-dragging,html.lx-dragging *{cursor:col-resize!important;-webkit-user-select:none!important;user-select:none!important}
html.lx-dragging iframe{pointer-events:none!important}
/* the name of a folded item, and of the hide control, on a tooltip (placed by the script, so the rail never clips it) */
.sb-tip{position:fixed;left:0;top:0;z-index:300;pointer-events:none;opacity:0;transition:opacity .12s;background:#fff;color:#0A0B0E;border-radius:3px;
  font:500 13px/18px Inter,system-ui,sans-serif;padding:5px 9px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.sb-tip.on{opacity:1}
/* round 4: the page level. A page's own side bar inside a shell: charcoal a step above the shell's black, 224 px by default, a smaller
   header that reads as the section's name, compact rows. Highlighting is monochrome on both levels (Bazil, later the same day): the
   current item is a neutral lifted fill with white words and a white icon; the levels differ by ground, width and density. */
html.lx-inshell{--sbw-open:224px}
html.lx-inshell .sb{background:#17191E;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset -1px 0 0 rgba(255,255,255,.08)}
html.lx-inshell .sb-top{padding:12px 10px 8px 16px}
html.lx-inshell .sb-id{padding-top:7px}
html.lx-inshell .sb-id b{font:600 13px/18px Inter,system-ui,sans-serif;letter-spacing:0;color:rgba(255,255,255,.62)}
html.lx-inshell .sb-tg{color:rgba(255,255,255,.42)}
html.lx-inshell .sb-note{color:rgba(255,255,255,.46)}
html.lx-inshell .sb-foot{box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
@media (min-width:1100px){

  html.lx-inshell .sb .si:hover{background:rgba(255,255,255,.05)}
}
html.lx-inshell .sb .si.on,html.lx-inshell .sb .si[aria-current]:not([aria-current="false"]){color:#fff;background:rgba(255,255,255,.1)}
html.lx-inshell .sb .si.on .ic,html.lx-inshell .sb .si[aria-current]:not([aria-current="false"]) .ic{color:#fff}
@media (min-width:1100px){
  html.sb-off .sb-top{grid-template-columns:32px;padding:12px}
  html.sb-off .sb-tg .ic-close{display:none}
  html.sb-off .sb-tg .ic-open{display:block}
  html.sb-off .sb-id,html.sb-off .sb-sub,html.sb-off .sb .si .ct,html.sb-off .sb-note,html.sb-off .sb-rz{display:none}
  html.sb-off .sb-part{visibility:hidden;height:10px;padding:0;overflow:hidden}
  html.sb-off .sb-part:first-child{height:0}
  html.sb-off .sb .si{width:36px;justify-content:center;gap:0;padding:7px 0;min-height:34px}
  html.sb-off .sb .si .ic{margin-top:0}
  html.sb-off .sb .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  html.sb-off .sb-nav{scrollbar-width:none}
  html.sb-off .sb-nav::-webkit-scrollbar{width:0}
  html.sb-off .sb-foot:not(:has(.si)){display:none}
}
@media (max-width:1099px){
  .sb{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(255,255,255,.07)}
  .sb-top,.sb-foot,.sb-rz{display:none}
  .sb-nav{flex:none;display:flex;align-items:center;gap:2px;overflow-x:auto;overflow-y:hidden;padding:8px 12px;scrollbar-width:none}
  .sb-nav::-webkit-scrollbar{height:0}
  .sb-nav ol,.sb-nav li:not(.sb-part){display:contents}
  .sb-part,.sb-part:first-child{flex:none;padding:0 6px 0 14px;white-space:nowrap}
  .sb-part:first-child{padding-left:4px}
  .sb .si{width:auto;flex:none;margin:0;white-space:nowrap;padding:6px 12px 6px 10px;min-height:34px;align-items:center}
  .sb .si .ic{margin-top:0}
  .sb .si .lb{flex:none}
  .sb .si .ct{margin-left:4px}
}
/* an editor page's panel and preview, once the split has been moved */
@media (min-width:1001px){.work.split{grid-template-columns:var(--pw,440px) minmax(0,1fr)}}
@media (max-width:1000px){.split-rz{display:none}}
@media (prefers-reduced-motion:reduce){.sb *,.sb-tip{transition:none!important}}
</style>
