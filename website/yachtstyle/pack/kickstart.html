<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Yacht Style Arabia · Kickstart · Enquiry to Live · Brand Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ECEDE7;--paper-2:#F4F4EF;--ink:#15161A;--ink-soft:#54565d;--ink-faint:#8a8c86;--line:#D4D5CC;--bright:#2536F5;--bright-deep:#1421B8;--dim:#9A9C94;--green:#1A8F5A;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Inter",system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;background-image:radial-gradient(rgba(21,22,26,.04) .6px,transparent .7px);background-size:22px 22px;}
  .ks{max-width:min(1080px,100%);margin:0 auto;padding:clamp(20px,3vw,34px) clamp(16px,3vw,34px) 70px;}
  .ks-eyebrow{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bright-deep);}
  .ks h1{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(28px,4.4vw,42px);line-height:1.05;letter-spacing:-.01em;margin-top:4px;}
  .ks-sub{color:var(--ink-soft);font-size:clamp(13.5px,1.6vw,15px);margin-top:4px;}

  /* ---- onboarding journey diagram ---- */
  .ks-journey{display:flex;gap:0;margin:24px 0 16px;border:1px solid var(--line);border-radius:20px;background:#fff;padding:clamp(20px,2.6vw,30px) clamp(10px,2vw,22px);box-shadow:0 14px 40px -26px rgba(20,24,55,.4);overflow-x:auto;}
  .ks-stage{flex:1;min-width:118px;text-align:center;position:relative;padding:0 4px;}
  .ks-stage:not(:last-child):after{content:"";position:absolute;top:27px;left:calc(50% + 28px);right:calc(-50% + 28px);height:3px;border-radius:3px;background:var(--line);z-index:0;}
  .ks-stage.done:not(:last-child):after{background:linear-gradient(90deg,var(--bright),var(--bright-deep));}
  .ks-node{width:54px;height:54px;border-radius:16px;background:var(--paper-2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;position:relative;z-index:1;color:var(--ink-faint);transition:.3s;}
  .ks-node svg{width:23px;height:23px;}
  .ks-stage.done .ks-node{background:linear-gradient(180deg,var(--bright),var(--bright-deep));border-color:transparent;color:#fff;box-shadow:0 8px 18px -8px rgba(37,54,245,.55);}
  .ks-stage.active .ks-node{border-color:var(--bright);color:var(--bright);box-shadow:0 0 0 4px rgba(37,54,245,.13);}
  .ks-stage .sl{font-size:13px;font-weight:600;color:var(--ink);}
  .ks-stage.upcoming .sl{color:var(--ink-soft);}
  .ks-stage .sd{font-family:Inter,sans-serif;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-top:3px;}
  .ks-stage .schk{position:absolute;top:14px;left:calc(50% + 14px);width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;z-index:2;}
  .ks-stage.done .schk{display:flex;}

  /* ---- overall ---- */
  .ks-overall{margin:16px 0 8px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.6));padding:clamp(16px,2.4vw,22px);box-shadow:0 14px 40px -26px rgba(20,24,55,.4);display:flex;align-items:center;gap:clamp(14px,3vw,26px);flex-wrap:wrap;}
  .ring{--p:0;width:84px;height:84px;flex:0 0 auto;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--paper-2) 0);display:flex;align-items:center;justify-content:center;transition:--p .8s ease;}
  @property --p{syntax:'<number>';inherits:false;initial-value:0;}
  .ring .ring-in{width:64px;height:64px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring .rp{font-family:"Fraunces",serif;font-size:20px;font-weight:600;line-height:1;color:var(--ink);}
  .ring .rl{font-size:8.5px;font-family:Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:2px;}
  .ks-overall .o-meta{flex:1;min-width:180px;}
  .ks-overall .o-meta h2{font-family:"Fraunces",serif;font-size:clamp(19px,2.4vw,24px);font-weight:600;}
  .ks-overall .o-meta p{color:var(--ink-soft);font-size:13.5px;margin-top:2px;}
  .o-btn{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:9px;padding:8px 13px;cursor:pointer;transition:.15s;}
  .o-btn:hover{border-color:var(--bright);color:var(--bright-deep);}

  .ks-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:clamp(14px,2vw,18px);margin-top:18px;}
  .ks-card{border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 10px 30px -24px rgba(20,24,55,.45);}
  .ks-card-h{padding:16px 20px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line);background:var(--paper-2);}
  .ks-card-h .ic{width:36px;height:36px;border-radius:11px;background:rgba(37,54,245,.1);color:var(--bright);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .ks-card-h .ic svg{width:18px;height:18px;}
  .ks-card-h h3{font-family:"Fraunces",serif;font-size:17px;font-weight:600;flex:1;}
  .ks-card-h .cc{font-family:Inter,sans-serif;font-size:11px;color:var(--green);font-weight:700;}
  .ks-pbar{height:5px;background:var(--paper-2);}
  .ks-pfill{height:100%;width:0;background:linear-gradient(90deg,var(--green),#46c089);transition:width .4s ease;}

  .ks-item{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid var(--paper-2);align-items:flex-start;cursor:pointer;transition:background .12s;}
  .ks-item:last-child{border-bottom:none;}
  .ks-item:hover{background:#fbfbfe;}
  .ks-box{width:22px;height:22px;border:2px solid var(--line);border-radius:7px;flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;transition:.15s;background:#fff;}
  .ks-item.done .ks-box{background:var(--green);border-color:var(--green);transform:scale(1.04);}
  .ks-ic{width:30px;height:30px;border-radius:9px;background:var(--paper-2);color:var(--bright);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:-1px;transition:.15s;}
  .ks-ic svg{width:16px;height:16px;}
  .ks-item.done .ks-ic{background:rgba(26,143,90,.12);color:var(--green);}
  .ks-ct{flex:1;}
  .ks-ct .t{font-size:14px;font-weight:600;color:var(--ink);line-height:1.3;}
  .ks-ct .d{font-size:12.5px;color:var(--ink-faint);margin-top:2px;line-height:1.45;}
  .ks-item.done .ks-ct .t{text-decoration:line-through;color:var(--ink-faint);}

  .ks-foot{margin-top:18px;font-size:12px;color:var(--dim);}

  /* ---- team tips & notes (ported from an earlier client kickstart build) ---- */
  .ks-ct .tip{display:none;gap:7px;align-items:flex-start;margin-top:7px;font-size:12px;line-height:1.45;color:#1421B8;background:rgba(37,54,245,.06);border-left:2px solid var(--bright);border-radius:0 8px 8px 0;padding:6px 10px;}
  .ks-ct .tip.on{display:flex;}
  .ks-ct .tip b{font-family:Inter,sans-serif;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;padding-top:2px;}
  .tipt{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-family:Inter,sans-serif;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);background:var(--paper-2);border:1px dashed var(--line);border-radius:99px;padding:4px 10px;cursor:pointer;transition:.15s;}
  .tipt:hover{color:var(--bright-deep);border-color:var(--bright);}
  .tipt .car{transition:transform .15s;display:inline-block;}
  .tipt.on .car{transform:rotate(90deg);}
  .ks-note-btn{flex:0 0 auto;margin-top:1px;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .ks-note-btn svg{width:13px;height:13px;}
  .ks-note-btn:hover{border-color:var(--bright);color:var(--bright-deep);}
  .ks-note-btn.has{background:#FBF3DC;border-color:#E7D49C;color:#8a6d1f;}
  .ks-note{display:none;margin-top:8px;}
  .ks-note.open{display:block;}
  .ks-note textarea{width:100%;min-height:56px;resize:vertical;border:1px solid #E7D49C;background:#FFFDF4;border-radius:10px;padding:8px 11px;font:12.5px/1.5 "Inter",sans-serif;color:var(--ink);}
  .ks-note textarea:focus{outline:none;border-color:#d9b64a;box-shadow:0 0 0 3px rgba(217,182,74,.15);}
  .ks-note .nl{font-family:Inter,sans-serif;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#8a6d1f;margin-bottom:4px;display:block;}

  /* ---- diagram cards ---- */
  .ks-diagcard{border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 30px -24px rgba(20,24,55,.45);padding:16px 20px 18px;margin:14px 0;}
  .ks-dcap{font-family:Inter,sans-serif;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:10px;}
  .ks-diagcard svg{width:100%;height:auto;display:block;}

  /* ---- red box: what we need from the client ---- */
  .ks-redbox{border:2px solid #E5484D;border-radius:18px;background:linear-gradient(180deg,#FFF5F5,#fff);box-shadow:0 12px 34px -24px rgba(197,48,48,.55);padding:16px 20px 18px;margin:16px 0 4px;}
  .ks-redbox .rb-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .ks-redbox .rb-ic{width:34px;height:34px;border-radius:10px;background:#E5484D;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .ks-redbox .rb-ic svg{width:18px;height:18px;}
  .ks-redbox h3{font-family:"Fraunces",serif;font-size:18px;font-weight:600;color:#B4232A;flex:1;min-width:180px;}
  .ks-redbox .rb-tag{font-family:Inter,sans-serif;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#B4232A;background:#FCE8E8;border:1px solid #F3C4C4;border-radius:99px;padding:5px 11px;}
  .ks-redgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:9px;}
  .ks-redgrid .rg{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #F3C4C4;border-radius:11px;padding:10px 12px;}
  .ks-redgrid .rg .ri{width:27px;height:27px;border-radius:8px;background:#FCE8E8;color:#C5303C;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px;}
  .ks-redgrid .rg .ri svg{width:14px;height:14px;}
  .ks-redgrid .rg .rt{display:block;font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.25;}
  .ks-redgrid .rg .rd{display:block;font-size:11px;color:var(--ink-faint);margin-top:2px;line-height:1.4;}
  .ks-redbox .rb-foot{margin-top:11px;font-size:11.5px;color:#8a2b30;background:#FCE8E8;border-radius:10px;padding:9px 12px;line-height:1.5;}
</style>
<style id="bmKickLayout">/* kickstart as a single checklist flow · tidy, compact, tick on the right */
.ks{max-width:920px}
.ks-grid{grid-template-columns:1fr!important;max-width:820px;margin:14px auto 0;gap:0}
.ks-card{border-radius:14px;box-shadow:none;margin-bottom:26px;position:relative}
.ks-card:not(:last-child)::after{content:"";position:absolute;left:32px;bottom:-27px;width:2px;height:27px;background:var(--line)}
.ks-card-h{padding:11px 16px}
.ks-item{padding:9px 16px;gap:12px}
.ks-item .ks-box{order:9;margin-left:auto}
.ks-item .ks-ic,.ks-item.done .ks-ic{width:20px;height:20px;border-radius:0;background:none!important;margin-top:1px}
.ks-item .ks-ic svg{width:17px;height:17px}
.ks-card-h .ks-ic{width:22px;height:22px;border-radius:0;background:none!important}
.ks-card-h .ks-ic svg{width:18px;height:18px}
  /* Icon hierarchy: a phase header is a section marker (ink), a row is an action (blue).
     Header glyphs are reserved (compass, flag, pen, code, trend) and never appear in a row. */
  .ks-card-h .ic,.ks-card-h .ks-ic{color:var(--ink)!important}
  .ks-card-h .ic svg,.ks-card-h .ks-ic svg{stroke-width:2.1}
  .ks-item .ks-ic{color:var(--bright)}

.ks-ct .t{display:block}
.ks-ct .d{display:block;max-width:62ch}
.ks-journey{margin:16px 0 10px;padding:12px 10px}
.ks-overall{margin-bottom:4px}
.ks-card-h .ic{background:none!important;border-radius:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.ks-card-h .ic svg{width:18px;height:18px}
.ks-eyebrow,.ks h1,.ks-sub{max-width:820px;margin-left:auto;margin-right:auto}
.ks-journey{max-width:820px;margin:16px auto 10px}
.ks-overall{max-width:820px;margin-left:auto;margin-right:auto}
.ks-card{overflow:hidden}
.ks-card-h{border-radius:13px 13px 0 0}
.ks-pbar{overflow:hidden}
.ks-node{width:44px;height:44px;border-radius:13px;margin-bottom:9px}
.ks-node svg{width:19px;height:19px}
.ks-journey{padding:12px 6px}
.ks-redbox,.ks-diagcard{max-width:820px;margin-left:auto;margin-right:auto}
.ks-item .ks-note-btn{order:8;margin-left:auto}
.ks-item .ks-box{margin-left:12px}
.ks-card-h{background:#EEF0FF;border-bottom:0}
.ks-pbar{height:3px;background:#E7E8EE}

/* ---- 20 Aug: header goes monochrome (black plate, white icon + white font) ---- */
.ks-card-h{background:var(--ink)!important;border-bottom:0}
.ks-card-h h3{color:#fff}
.ks-card-h .ic,.ks-card-h .ks-ic{color:#fff!important}
.ks-card-h .ic svg,.ks-card-h .ks-ic svg{stroke-width:2.05}
.ks-card-h .cc{color:rgba(255,255,255,.62)}
.ks-pbar{height:3px;background:#E7E8EE}

/* ---- 20 Aug: a real connector between phase cards.
   The old .ks-card::after could never show: the card is overflow:hidden, so anything at
   bottom:-27px was clipped. The connector is now its own element BETWEEN the cards. ---- */
.ks-card:not(:last-child)::after{display:none}
.ks-card{margin-bottom:0}
/* the connector is a hairline with a node at the join, not a chunky grey chevron: the
   flow is already top to bottom, so the line only has to say "continues". */
.ks-link{height:30px;position:relative;display:block}
.ks-link::before{content:"";position:absolute;left:32px;top:0;bottom:0;width:1px;background:var(--line)}
.ks-link::after{content:"";position:absolute;left:28.5px;bottom:-4px;width:8px;height:8px;border-radius:99px;
  background:var(--bright);box-shadow:0 0 0 3px #fff;z-index:1}

/* ---- 20 Aug: the journey strip fits, no horizontal slider.
   7 stages x min-width:118px = 826px inside an 808px box, which forced the scrollbar. ---- */
.ks-journey{overflow-x:hidden}
.ks-stage{min-width:0;flex:1 1 0;padding:0 3px}
.ks-stage .sd{font-size:9px;letter-spacing:.03em;word-break:normal}
.ks-item.gold{background:linear-gradient(90deg,#FDF6E3,#FFFDF6)}
.ks-item.gold:hover{background:#FBF3DC}
.ks-item.gold .ks-ic{color:#B8860B!important}
.ks-item.gold .ks-ct .t{color:#7A5C10}
.ks-item.gold .ks-box{border-color:#D9B64A}
.ks-who{order:7;margin-left:auto;flex:0 0 auto;align-self:center;font-family:Inter,sans-serif;font-size:8.5px;letter-spacing:.06em;font-weight:700;text-transform:uppercase;border-radius:99px;padding:4px 9px;border:1px solid;white-space:nowrap}
.who-bm{color:#1421B8;background:#EEF0FF;border-color:#D0D6F5}
.who-cl{color:#B4451A;background:#FDEFE7;border-color:#F3CBB4}
.who-both{color:#54565d;background:#F4F4EF;border-color:#D4D5CC}
.who-pay{color:#7A5C10;background:#FBF3DC;border-color:#E7D49C}
.who-done{color:#136844;background:#E9F7EF;border-color:#BFE4CF}
.ks-item .ks-note-btn{margin-left:10px}
@media (max-width:640px){.ks-who{display:none}}
</style>
</head>

<script>

    +'<div class="ks-eyebrow">Brand Method · Kickstart</div>'
    +'<h1>'+KICK.client+'</h1><div class="ks-sub">'+KICK.subtitle+'</div>'
    +(journeyHTML?'<div class="ks-journey">'+journeyHTML+'</div>':'')
    +'<div class="ks-overall"><div class="ring" id="ring"><div class="ring-in"><span class="rp" id="rp">0%</span><span class="rl">Ready</span></div></div>'
      +'<div class="o-meta"><h2 id="ometa">0 of '+totalItems+' done</h2><p>Work top to bottom, phase by phase. Tick as you go, note every answer · saves in your browser.</p></div>'
      +'<button class="o-btn" id="tipAll" type="button">Show team tips</button><button class="o-btn" id="ksReset">Reset</button></div>'
    +redNeedsHTML+DIAG_MONEY+DIAG_TIMELINE
    +'<div class="ks-grid">'+cardsHTML+'</div>'
    +'<div class="ks-foot">'+KICK.client+' · kickstart progress is saved locally and persists when you reopen this page.</div>';

  function refresh(){
    KICK.groups.forEach(function(g,gi){
      var done=0; g.items.forEach(function(it,ii){ if(store[key(gi,ii)])done++; });
      document.querySelector('[data-cc="'+gi+'"]').textContent=done+' / '+g.items.length;
      document.querySelector('[data-pf="'+gi+'"]').style.width=(done/g.items.length*100)+'%';
    });
    var p=pctNow();
    document.getElementById('rp').textContent=p+'%';
    document.getElementById('ring').style.setProperty('--p',p);
    document.getElementById('ometa').textContent=doneCount()+' of '+totalItems+' done';
    // light up journey stages by progress
    var stages=document.querySelectorAll('[data-stage]'), ns=stages.length;
    var filled=Math.round(p/100*ns);
    [].forEach.call(stages,function(st,i){ st.classList.toggle('done',i<filled); st.classList.toggle('active',i===filled&&p<100); st.classList.toggle('upcoming',i>filled); });
  }
  setTimeout(refresh,120);

  [].forEach.call(document.querySelectorAll('.ks-item'),function(row){
    var nb=row.querySelector('[data-noteb]'), na=row.querySelector('[data-note]'), ta=na?na.querySelector('textarea'):null;
    if(nb) nb.addEventListener('click',function(e){ e.stopPropagation(); na.classList.toggle('open'); if(na.classList.contains('open')&&ta) ta.focus(); });
    var tb=row.querySelector('[data-tipt]'), tp=row.querySelector('.tip');
    if(tb) tb.addEventListener('click',function(e){ e.stopPropagation(); tb.classList.toggle('on'); tp.classList.toggle('on'); });
    if(na) na.addEventListener('click',function(e){ e.stopPropagation(); });
    if(ta) ta.addEventListener('input',function(){ store[ta.getAttribute('data-nk')]=ta.value; save(); nb.classList.toggle('has',!!ta.value.trim()); });
    row.addEventListener('click',function(){
      var gi=row.getAttribute('data-g'), ii=row.getAttribute('data-i'), k=key(gi,ii);
      store[k]=!store[k]; save();
      row.classList.toggle('done',!!store[k]);
      row.querySelector('.ks-box').textContent=store[k]?'✓':'';
      refresh();
    });
  });
  var tipAllOn=false;
  document.getElementById('tipAll').addEventListener('click',function(){
    tipAllOn=!tipAllOn;
    [].forEach.call(document.querySelectorAll('.tip'),function(x){ x.classList.toggle('on',tipAllOn); });
    [].forEach.call(document.querySelectorAll('[data-tipt]'),function(x){ x.classList.toggle('on',tipAllOn); });
    this.textContent=tipAllOn?'Hide team tips':'Show team tips';
  });
  document.getElementById('ksReset').addEventListener('click',function(){
    if(!confirm('Reset all kickstart progress and notes for '+KICK.client+'?')) return;
    store={}; save(); location.reload();
  });
})();
</script>
