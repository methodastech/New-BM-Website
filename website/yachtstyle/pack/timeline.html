<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yacht Style Arabia · Website Timeline · Brand Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECEDE7;--paper-2:#F4F4EF;--ink:#15161A;--ink-soft:#54565d;--ink-faint:#8a8c86;
    --line:#D4D5CC;--line-soft:#E4E5DD;--bright:#2563EB;--bright-deep:#1D4ED8;--dim:#9A9C94;
    --strategy:#2563EB;--design:#8B5CF6;--content:#0E7490;--performance:#1A8F5A;--phase2:#B07A12;
    --done:#1A8F5A;--now:#1E73E8;--lblw:210px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Inter",system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;
    background-image:radial-gradient(rgba(21,22,26,.04) .6px,transparent .7px);background-size:22px 22px;}
  html,body{min-height:100%;}
  .tl-wrap{max-width:none;margin:0 auto;padding:16px 20px 24px;}
  .tl-head,.now-card,.tl-legend,.tl-foot{flex:0 0 auto;}

  /* header + live status */
  .tl-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
  .tl-eyebrow{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bright-deep);}
  .tl-head h1{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:-.01em;margin-top:4px;}
  .tl-sub{color:var(--ink-soft);font-size:14.5px;margin-top:4px;}

  .now-card{margin:22px 0 8px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.6));padding:20px 22px;box-shadow:0 14px 40px -26px rgba(20,24,55,.4);}
  .now-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .now-dot{width:10px;height:10px;border-radius:50%;background:var(--now);box-shadow:0 0 0 0 rgba(30,115,232,.5);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,115,232,.5)}70%{box-shadow:0 0 0 9px rgba(30,115,232,0)}100%{box-shadow:0 0 0 0 rgba(30,115,232,0)}}
  .now-label{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--now);font-weight:700;}
  .now-date{margin-left:auto;font-family:Inter,sans-serif;font-size:12px;color:var(--ink-soft);}
  .now-phase{font-family:"Fraunces",serif;font-size:23px;font-weight:600;margin:10px 0 2px;}
  .now-meta{color:var(--ink-soft);font-size:13.5px;}
  .now-bar-wrap{display:flex;align-items:center;gap:14px;margin-top:16px;}
  .now-bar{flex:1;height:10px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden;}
  .now-bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--strategy),var(--content));border-radius:999px;transition:width 1.1s cubic-bezier(.4,1.3,.4,1);}
  .now-pct{font-family:"Fraunces",serif;font-size:20px;font-weight:600;min-width:54px;text-align:right;}

  /* legend */
  .tl-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:22px 0 10px;font-size:11.5px;color:var(--ink-soft);}
  .tl-legend span{display:inline-flex;align-items:center;gap:6px;}
  .tl-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .lg-strategy{background:var(--strategy)}.lg-design{background:var(--design)}.lg-content{background:var(--content)}.lg-performance{background:var(--performance)}.lg-phase2{background:repeating-linear-gradient(45deg,var(--phase2),var(--phase2) 3px,transparent 3px,transparent 6px),rgba(176,122,18,.25)}

  /* chart shell */
  .gx{margin-top:6px;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column;}
  .gx-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,var(--paper-2));flex:0 0 auto;}
  .seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
  .seg button{border:none;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--ink-soft);padding:6px 15px;border-radius:999px;cursor:pointer;transition:.15s;}
  .seg button.on{background:#fff;color:var(--bright-deep);box-shadow:0 2px 6px -2px rgba(20,24,55,.3);}
  .gx-btn{border:1px solid var(--line);background:#fff;border-radius:999px;font:inherit;font-size:12px;font-weight:600;color:var(--ink-soft);padding:6px 14px;cursor:pointer;transition:.15s;}
  .gx-btn:hover{border-color:var(--bright);color:var(--bright-deep);}
  .gx-hint{margin-left:auto;font-size:11px;color:var(--dim);}

  .gx-scroll{overflow:auto;-webkit-overflow-scrolling:touch;position:relative;scrollbar-width:thin;flex:1 1 auto;min-height:0;}
  .gx-scroll::-webkit-scrollbar{height:10px;}
  .gx-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid #fff;}
  .gx-inner{position:relative;width:max-content;min-width:100%;}

  /* axis */
  .gx-axis{display:flex;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:7;}
  .axhdr{position:sticky;left:0;z-index:8;width:var(--lblw);flex:0 0 var(--lblw);background:#fff;border-right:1px solid var(--line);display:flex;align-items:flex-end;padding:0 14px 6px;font-family:Inter,sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
  .axarea{position:relative;height:50px;flex:0 0 auto;}
  .ax-mo{position:absolute;top:0;height:27px;border-left:1px solid var(--line);padding:6px 0 0 8px;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;}
  .ax-mo b{font-family:Inter,sans-serif;font-weight:500;font-size:9px;color:var(--dim);margin-left:5px;}
  .ax-sub{position:absolute;top:27px;height:23px;border-left:1px solid var(--line-soft);font-size:9.5px;color:var(--ink-faint);padding-top:5px;text-align:center;overflow:hidden;white-space:nowrap;}
  .ax-sub.wk{padding:5px 0 0 6px;text-align:left;font-weight:600;color:var(--ink-soft);}
  .ax-sub b{font-family:Inter,sans-serif;font-weight:500;display:block;font-size:8px;color:var(--dim);margin-top:1px;}
  .ax-sub.wknd{background:rgba(21,22,26,.045);}
  .ax-sub.m1{border-left:1px solid var(--line);}

  /* body */
  .gx-body{position:relative;}
  .gx-over{position:absolute;top:0;bottom:0;left:var(--lblw);pointer-events:none;z-index:6;}
  .today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:7;}
  .today-line:before{content:"TODAY";position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--now);color:#fff;font-family:Inter,sans-serif;font-size:8px;font-weight:700;letter-spacing:.08em;padding:2px 5px;border-radius:0 0 5px 5px;white-space:nowrap;}
  .cross-line{position:absolute;top:0;bottom:0;width:1px;background:rgba(37,54,245,.45);opacity:0;transition:opacity .1s;}
  .cross-chip{position:absolute;top:2px;transform:translateX(-50%);background:var(--bright-deep);color:#fff;font-family:Inter,sans-serif;font-size:9px;padding:2px 7px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .1s;box-shadow:0 4px 10px -4px rgba(20,24,55,.5);}

  .grow{display:flex;border-bottom:1px solid var(--paper-2);cursor:pointer;transition:background .12s;}
  .grow:last-child{border-bottom:none;}
  .grow:hover{background:#fbfbfe;}
  .grow.on{background:rgba(37,54,245,.05);}
  .glabel{position:sticky;left:0;z-index:4;width:var(--lblw);flex:0 0 var(--lblw);background:#fff;border-right:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:9px;min-width:0;}
  .grow:hover .glabel{background:#fbfbfe;}
  .grow.on .glabel{background:#f3f4ff;}
  .gstatus{width:17px;height:17px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;}
  .st-done{background:var(--done);}
  .st-active{background:var(--now);box-shadow:0 0 0 3px rgba(30,115,232,.18);}
  .st-upcoming{background:#fff;border:1.5px solid var(--line);}
  .gnm{font-size:13px;font-weight:600;color:var(--ink);line-height:1.2;min-width:0;}
  .gnm small{display:block;font-weight:400;color:var(--ink-faint);font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gtrack{position:relative;height:46px;flex:0 0 auto;border-left:1px solid var(--line-soft);}
  .gbar{position:absolute;top:11px;height:24px;border-radius:7px;display:flex;align-items:center;padding:0 9px;color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;box-shadow:0 4px 10px -5px rgba(20,24,55,.45);transition:filter .15s;}
  .grow:hover .gbar{filter:brightness(1.06);}
  .b-strategy{background:linear-gradient(90deg,var(--strategy),#60A5FA);}
  .b-design{background:linear-gradient(90deg,var(--design),#A78BFA);}
  .b-content{background:linear-gradient(90deg,var(--content),#22D3EE);}
  .b-performance{background:linear-gradient(90deg,var(--performance),#33b07a);}
  .b-phase2{background:repeating-linear-gradient(45deg,rgba(176,122,18,.95),rgba(176,122,18,.95) 6px,rgba(176,122,18,.7) 6px,rgba(176,122,18,.7) 12px);}
  .gbar.done{opacity:.92;}
  .gbar.upcoming{opacity:.55;}
  .gbar.active{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--now),0 8px 16px -6px rgba(30,115,232,.5);}
  .gbar.point{width:16px!important;height:16px;top:15px;padding:0;border-radius:50%;border:2px solid #fff;}

  /* milestones */
  .ms-row{display:flex;border-top:1px solid var(--line);background:var(--paper-2);}
  .mslbl{position:sticky;left:0;z-index:4;width:var(--lblw);flex:0 0 var(--lblw);background:var(--paper-2);border-right:1px solid var(--line);padding:9px 14px;font-family:Inter,sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);}
  .ms-track{position:relative;height:44px;flex:0 0 auto;}
  .ms{position:absolute;top:7px;transform:translateX(-50%);text-align:center;white-space:nowrap;}
  .ms.stack{top:24px;}
  .ms .sym{font-size:14px;line-height:1;color:var(--bright-deep);}
  .ms .mtxt{font-size:9px;color:var(--ink-soft);font-weight:600;margin-top:1px;}

  /* detail panel */
  .gx-detail{border-top:1px solid var(--line);padding:0 18px;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease;background:var(--paper-2);flex:0 0 auto;}
  .gx-detail.open{max-height:260px;padding:16px 18px;}
  .gd-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .gd-h h3{font-family:"Fraunces",serif;font-size:18px;font-weight:600;}
  .gd-pill{font-family:Inter,sans-serif;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:999px;color:#fff;}
  .gd-dates{font-family:Inter,sans-serif;font-size:11px;color:var(--ink-soft);margin-left:auto;}
  .gd-body{margin-top:9px;font-size:14px;color:var(--ink-soft);line-height:1.6;}
  .gd-hint{font-size:12px;color:var(--dim);margin-top:12px;font-style:italic;}

  .tl-foot{margin-top:12px;font-size:12px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .tl-foot b{color:var(--ink-soft);}

  /* phase bands */
  .gband-row{display:flex;border-bottom:1px solid var(--line);background:#fff;}
  .gband-lbl{position:sticky;left:0;z-index:4;width:var(--lblw);flex:0 0 var(--lblw);background:#fff;border-right:1px solid var(--line);padding:0 14px;display:flex;align-items:center;font-family:Inter,sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
  .gband-track{position:relative;height:32px;flex:0 0 auto;}
  .gband{position:absolute;top:5px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;padding:0 9px;}
  .gband.p1{background:rgba(37,99,235,.12);color:var(--bright-deep);}
  .gband.p2{background:repeating-linear-gradient(45deg,rgba(176,122,18,.2),rgba(176,122,18,.2) 6px,rgba(176,122,18,.08) 6px,rgba(176,122,18,.08) 12px);color:#8a5e0e;}
  /* section headers */
  .sec-row{display:flex;background:var(--paper-2);border-top:1px solid var(--line);}
  .sec-lbl{position:sticky;left:0;z-index:4;width:var(--lblw);flex:0 0 var(--lblw);background:var(--paper-2);padding:6px 14px;font-family:Inter,sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .sec-fill{flex:0 0 auto;background:var(--paper-2);}
  /* cadence + payment rows */
  .cad-row{display:flex;border-bottom:1px solid var(--paper-2);background:#fff;}
  .cad-lbl{position:sticky;left:0;z-index:4;width:var(--lblw);flex:0 0 var(--lblw);background:#fff;border-right:1px solid var(--line);padding:7px 12px;display:flex;flex-direction:column;justify-content:center;}
  .cad-lbl b{font-size:12px;font-weight:600;color:var(--ink);line-height:1.2;}
  .cad-lbl small{font-size:10px;color:var(--ink-faint);}
  .cad-track{position:relative;height:34px;flex:0 0 auto;border-left:1px solid var(--line-soft);}
  .cad-star{position:absolute;top:8px;transform:translateX(-50%);font-size:13px;line-height:1;color:#C9941F;}
  .cad-dline{position:absolute;top:16px;height:0;border-top:1.5px solid var(--strategy);}
  .cad-dline.wa{border-top-color:var(--performance);}
  .cad-chip{position:absolute;top:7px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:100px;padding:2px 11px;font-size:9.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
  .pay-track{position:relative;height:84px;flex:0 0 auto;border-left:1px solid var(--line-soft);}
  .payc{position:absolute;top:6px;transform:translateX(-50%);background:rgba(26,143,90,.1);border:1px solid rgba(26,143,90,.35);border-radius:8px;padding:4px 10px;text-align:center;white-space:nowrap;}
  .payc.stack{top:44px;}
  .payc.stack::before{content:"";position:absolute;left:50%;top:-16px;width:1px;height:16px;background:rgba(26,143,90,.4);}
  .payc b{display:block;font-size:13px;font-weight:800;color:#15803D;line-height:1.1;}
  .payc span{display:block;font-size:8.5px;font-weight:600;color:#1F7A4D;}
  @media(max-height:620px){ .gx{height:88vh;} }
  @media(max-width:640px){ .tl-wrap{padding:16px 14px 16px;} :root{--lblw:148px;} .now-date{margin-left:0;width:100%;} .gx-hint{display:none;} }
  /* compact top chrome so the chart gets more vertical room */
  .now-card{margin:10px 0 6px;padding:13px 18px;}
  .now-phase{font-size:16px;margin:6px 0 2px;}
  .now-meta{font-size:12px;}
  .now-bar-wrap{margin-top:9px;}
  .now-pct{font-size:16px;}
  .tl-head h1{font-size:clamp(20px,2.6vw,28px);}
  .tl-sub{font-size:13px;margin-top:2px;}
  .tl-legend{margin:10px 0 8px;}
  /* compact the Gantt rows so more fits vertically */
  .gx-bar{padding:8px 14px;}
  .axarea{height:44px;}
  .ax-mo{height:24px;padding-top:5px;}
  .ax-sub{top:24px;height:20px;padding-top:4px;}
  .gtrack{height:36px;}
  .gbar{top:7px;height:22px;}
  .gbar.point{top:11px;}
  .glabel{padding:4px 12px;}
  .gnm{font-size:12.5px;line-height:1.14;}
  .gnm small{font-size:10px;margin-top:0;}
  .gband-track{height:26px;}
  .gband{top:4px;height:18px;}
  .ms-track{height:32px;}
  .ms{top:4px;}
  .ms.stack{top:17px;}
  .cad-track{height:26px;}
  .cad-star{top:5px;}
  .cad-dline{top:12px;}
  .cad-chip{top:4px;}
  .pay-track{height:72px;}
  .payc{top:5px;}
  .payc.stack{top:38px;}
  .payc.stack::before{top:-14px;height:14px;}
  .cad-lbl{padding:4px 12px;}
  .sec-lbl{padding:4px 14px;}
  /* clearer milestone targets */
  .mst-line{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid;opacity:.55;z-index:6;pointer-events:none;}
  .mst-line.star{border-left-color:var(--bright);}
  .mst-line.diamond{border-left-color:#B07A12;}
  .ms-row,.mslbl{background:#fbfbff;}
  .ms-track{height:48px;}
  .ms{top:6px;}
  .ms.stack{top:26px;}
  .ms-badge{display:inline-block;color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.02em;padding:4px 10px;border-radius:8px;white-space:nowrap;font-family:Inter,sans-serif;box-shadow:0 5px 12px -4px rgba(20,24,55,.55);}
  .ms-badge.star{background:var(--bright);}
  .ms-badge.diamond{background:#B07A12;}
  .zoomctl{display:inline-flex;gap:2px;}
  .zb{min-width:32px;padding:6px 0;font-size:16px;line-height:1;font-weight:700;}
  .mst-line{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid rgba(37,54,245,.6);z-index:5;pointer-events:none;}
  /* payment chips wrap narrow; packTrack stacks them into lanes so they never collide */
  .payc{white-space:normal;max-width:210px;line-height:1.2;}
  .payc span{white-space:normal;}
  /* before-we-start: from-you kickstart chips */
  .fy-track{flex:0 0 auto;min-width:0;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-left:1px solid var(--line-soft);}
  .fy-chip{display:inline-flex;align-items:baseline;gap:6px;background:#fff;border:1px solid var(--line);border-radius:100px;padding:5px 12px;font-size:10.5px;white-space:normal;max-width:330px;box-shadow:0 4px 10px -8px rgba(20,24,55,.4);}

  /* ==== client requirements section, above the chart ==== */
  .req{margin:0 0 18px;border:1px solid var(--line);border-radius:14px;background:var(--paper-2,#fff);overflow:hidden;}
  .req-h{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid var(--line-soft);background:rgba(37,54,245,.045);}
  .req-h h3{margin:0;font-family:Fraunces,serif;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--ink);}
  .req-h .req-tag{font-family:Inter,sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#1421B8;background:rgba(37,54,245,.10);border:1px solid rgba(37,54,245,.22);border-radius:99px;padding:3px 9px;}
  .req-h p{margin:3px 0 0;font-size:12px;color:var(--ink-soft);flex:1 1 100%;}
  .req-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:0;}
  .req-i{display:flex;gap:11px;padding:12px 18px;border-top:1px solid var(--line-soft);border-right:1px solid var(--line-soft);}
  .req-i:nth-child(-n+2){border-top:none;}
  .req-n{flex:0 0 auto;width:19px;height:19px;border-radius:5px;background:#fff;border:1.5px solid rgba(37,54,245,.45);}
  .req-t b{display:block;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.35;}
  .req-t i{display:block;font-style:normal;font-size:11px;color:var(--ink-soft);line-height:1.5;margin-top:2px;}
  @media (max-width:640px){ .req-grid{grid-template-columns:1fr} .req-i{border-right:none} .req-i:nth-child(-n+2){border-top:1px solid var(--line-soft)} .req-i:first-child{border-top:none} }
  @media print{ .req{break-inside:avoid;page-break-inside:avoid} }
  .fy-chip b{font-weight:700;color:var(--ink);}
  .fy-chip i{font-style:normal;color:var(--ink-faint);font-size:9.5px;}
  /* ---- PRINT / SAVE-AS-PDF ---- the portal prints this via window.print(); without these,
     the height:100vh shell clips, sticky columns misplace, and Chrome rasterises the badge
     drop-shadows into hard grey boxes that read as overlap. */
  @media print{
    html,body{background:#fff !important;}
    body{background-image:none !important;}
    *{box-shadow:none !important;}                 /* kill the grey shadow boxes on badges/chips/cards */
    .tl-wrap{padding:0 !important;}
    .now-card{border:1px solid var(--line) !important;}
    .gx{height:auto !important;border:1px solid var(--line) !important;}
    .gx-bar{display:none !important;}               /* hide the zoom/Today/Fit controls in the PDF */

    if(PROJECT.fromYou&&PROJECT.fromYou.length){
      var reqItems=PROJECT.fromYou.map(function(it){
        return '<div class="req-i"><span class="req-n"></span><span class="req-t"><b>'+esc(it.label)+'</b>'+(it.note?'<i>'+esc(it.note)+'</i>':'')+'</span></div>';
      }).join('');
      reqHTML='<div class="req">'
        +'<div class="req-h"><h3>What we need from the Client</h3><span class="req-tag">'+PROJECT.fromYou.length+' items &middot; each with its date</span>'
        +'<p>The schedule holds when these are ready. Each item is listed with the date it is needed by. Where an item arrives late, every date after it moves day for day.</p></div>'
        +'<div class="req-grid">'+reqItems+'</div></div>';
    }

    /* payment milestones */
    var pay='';
    if(PROJECT.payments&&PROJECT.payments.length){
      pay+='<div class="sec-row"><div class="sec-lbl">Payments</div><div class="sec-fill" style="width:'+TRACKW+'px"></div></div>';
      var chips=PROJECT.payments.map(function(p){
        var x=Math.max(60,Math.min(TRACKW-60,(days(S,d(p.date))+.5)*PPD));
        return '<div class="payc" style="left:'+x+'px" title="'+esc(p.pct)+' · '+esc(p.label)+'"><b>'+esc(p.pct)+'</b><span>'+esc(p.label)+'</span></div>';
      }).join('');
      pay+='<div class="cad-row"><div class="cad-lbl"><b>Payment</b><small>'+esc(PROJECT.paySplit||'')+'</small></div><div class="pay-track" style="width:'+TRACKW+'px">'+chips+'</div></div>';
    }

    var todayX=((TODAY-S)/DAY)*PPD, inRange=(TODAY>=S&&TODAY<E);
    var mstHTML=PROJECT.milestones.map(function(m){ return '<div class="mst-line '+(m.sym==='★'?'star':'diamond')+'" style="left:'+((days(S,d(m.date))+.5)*PPD)+'px" title="'+esc(m.label)+' · '+fmtFull(d(m.date))+'"></div>'; }).join('');
    var over='<div class="gx-over" style="width:'+TRACKW+'px">'+mstHTML
      +(inRange?'<div class="today-line" style="left:'+todayX+'px"></div>':'')
      +'<div class="cross-line" id="crossLine"></div><div class="cross-chip" id="crossChip"></div></div>';

    var _rb=document.getElementById('reqBox'); if(_rb) _rb.innerHTML=reqHTML;
    document.getElementById('chart').innerHTML=buildAxis(PPD,TRACKW)
      +'<div class="gx-body">'+over+bandRow+rows
      +'<div class="ms-row"><div class="mslbl">Milestones</div><div class="ms-track" style="width:'+TRACKW+'px">'+ms+'</div></div>'
      +cad+pay
      +'</div>';

    /* measured, multi-lane anti-overlap: no milestone or payment ever collides, the lane grows the track instead */
    packTrack(document.querySelector('.ms-track'), '.ms', 7);
    packTrack(document.querySelector('.pay-track'), '.payc', 10);
    /* re-pack once webfonts finish loading, so badge widths are final and lanes are exact */
    if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(function(){
      packTrack(document.querySelector('.ms-track'), '.ms', 7);
      packTrack(document.querySelector('.pay-track'), '.payc', 10);
    }); }

    fitLabels(); if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(fitLabels); }
    [].forEach.call(document.querySelectorAll('.seg button'),function(b){ b.classList.toggle('on', b.getAttribute('data-lv')===level); });
  }

  /* place absolutely-positioned items into stacked lanes using their REAL measured widths,
     then grow the track height to fit every lane, so nothing overlaps at any zoom level */
  function packTrack(track, sel, gap){
    if(!track) return;
    var items=[].slice.call(track.querySelectorAll(sel)); if(!items.length) return;
    /* idempotent: remember each item's true date-x once, reset to it before every pack,
       so a re-pack (e.g. after webfonts load and badge widths change) recomputes lanes cleanly */
    items.forEach(function(el){ if(!el.hasAttribute('data-x0')) el.setAttribute('data-x0', String(parseFloat(el.style.left)||0)); el.style.left=el.getAttribute('data-x0')+'px'; el.style.top=''; });
    var tr=track.getBoundingClientRect(), tw=tr.width;
    var arr=items.map(function(el){ var r=el.getBoundingClientRect(); return {el:el,x0:parseFloat(el.style.left)||0,left:r.left-tr.left,right:r.right-tr.left,h:r.height,shift:0}; });
    /* FIRST nudge any edge item fully onto the track (long labels never clip off the left/right)... */
    arr.forEach(function(it){ var o=0; if(it.left<2) o=2-it.left; else if(it.right>tw-2) o=(tw-2)-it.right; it.left+=o; it.right+=o; it.shift=o; });
    /* ...THEN assign lanes using the final positions, so a nudge never pushes an item into its lane-mate */
    arr.sort(function(a,b){ return a.left-b.left; });
    var maxH=0; arr.forEach(function(i){ if(i.h>maxH) maxH=i.h; });
    var step=maxH+gap, base=6, lanes=[], maxLane=0;
    arr.forEach(function(it){
      var lane=0;
      while(lane<lanes.length && it.left < lanes[lane]+8) lane++;
      lanes[lane]=it.right;
      it.el.style.top=(base+lane*step)+'px';
      if(it.shift) it.el.style.left=(it.x0+it.shift)+'px';
      if(lane>maxLane) maxLane=lane;
    });
    track.style.height=(base+(maxLane+1)*step+2)+'px';
  }

  /* hide a segment label that does not fit its bar, measured, never clipped mid-word */
  function fitLabels(){ [].forEach.call(document.querySelectorAll('.gbar'),function(b){ b.classList.remove('nolbl'); var s=b.firstChild; if(s&&s.offsetWidth>b.clientWidth-16) b.classList.add('nolbl'); }); [].forEach.call(document.querySelectorAll('.gband'),function(b){ b.classList.remove('nolbl'); var s=b.firstChild; if(s&&s.scrollWidth>s.clientWidth+1) b.classList.add('nolbl'); }); }
  function lblw(){ var a=document.querySelector('.axhdr'); return a?a.offsetWidth:210; }
  function scroller(){ return document.querySelector('.gx-scroll'); }
  function scrollToDate(date,frac){
    var sc=scroller(); if(!sc) return;
    var x=days(S,date)*ppd();
    sc.scrollLeft=Math.max(0, x-(sc.clientWidth-lblw())*frac);
  }
  function centerDate(){
    var sc=scroller(); if(!sc) return null;
    var tx=sc.scrollLeft + sc.clientWidth/2 - lblw();
    return new Date(S.getTime()+(tx/ppd())*DAY);
  }
  function resetDetail(){ var g=document.getElementById('gd'); if(g) g.classList.remove('open'); openI=null; }
  function setLevel(lv){
    var c=centerDate(); level=lv; zoomMul=1; buildChart();
    if(c) scrollToDate(c,0.5);
    resetDetail();
  }
  function zoomBy(f){ var c=centerDate(); zoomMul=Math.max(PPD_MIN/ZOOM[level], Math.min(PPD_MAX/ZOOM[level], zoomMul*f)); buildChart(); if(c) scrollToDate(c,0.5); resetDetail(); }

  /* page scaffold */
  document.getElementById('tl').innerHTML=''
    +'<div class="tl-head"><div><div class="tl-eyebrow">'+esc(PROJECT.eyebrow||'Brand Method · Project Timeline')+'</div>'
      +'<h1>'+esc(PROJECT.client)+'</h1><div class="tl-sub">'+esc(PROJECT.subtitle)+'</div></div></div>'
    +'<div class="now-card">'
      +'<div class="now-top"><span class="now-dot"></span><span class="now-label">Where we are now</span>'
        +'<span class="now-date">'+fmtY(TODAY)+'</span></div>'
      +'<div class="now-phase">'+esc(nowPhaseName)+'</div>'
      +'<div class="now-meta">'+esc(nowMeta)+'</div>'
      +'<div class="now-bar-wrap"><div class="now-bar"><div class="now-bar-fill" id="nbf"></div></div><div class="now-pct">'+pctShown+'%</div></div>'
    +'</div>'
    +'<div class="tl-legend">'
      +Object.keys(TRACKNAME).map(function(k){ return '<span><i style="background:'+COLOR[k]+'"></i>'+TRACKNAME[k]+'</span>'; }).join('')
      +'<span><i class="lg-d"></i>Build, to the complete site</span><span><i class="lg-a"></i>Testing, amendments and fixes, then live</span><span>★ both choices, or Choice B&nbsp;&nbsp;◆ Choice A</span>'
      +'<span style="margin-left:auto">✓ done&nbsp;&nbsp;● in progress&nbsp;&nbsp;○ upcoming</span></div>'
    +'<div id="reqBox"></div>'
    +'<div class="gx">'
      +'<div class="gx-bar">'
        +'<div class="seg" id="zseg"><button data-lv="months" type="button">Months</button><button data-lv="weeks" type="button">Weeks</button><button data-lv="days" type="button">Days</button></div>'
        +'<div class="zoomctl"><button class="gx-btn zb" id="zOut" type="button" aria-label="Zoom out, bars closer" title="Closer (zoom out)">&minus;</button><button class="gx-btn zb" id="zIn" type="button" aria-label="Zoom in, bars wider" title="Wider (zoom in)">+</button></div>'
        +'<button class="gx-btn" id="btnToday" type="button">Today</button>'
        +'<button class="gx-btn" id="btnFit" type="button">Fit</button>'
        +'<span class="gx-hint">−/+ to zoom · scroll sideways · hover for the exact day · tap a row for detail</span>'
      +'</div>'
      +'<div class="gx-scroll"><div class="gx-inner" id="chart"></div></div>'
      +'<div class="gx-detail" id="gd"></div>'
    +'</div>'
    +'<div class="tl-foot"><b>'+esc(PROJECT.client)+'</b> · '+fmtY(K)+' → '+fmtY(H)+' · One proposal, two choices, on one timeline, from the proposal of 5 October 2026. Choice A, The Edition: RM15,000, RM16,200 with 8% SST: the Growth Website, RM10,000 at the founding rate (list RM20,000), and the editorial CMS in English and Arabic, RM5,000 at the founding rate (original RM10,000), with Brand Strategy · Core, worth RM2,500, included at no charge. Complete in two weeks, on Friday 23 October, then one more week of testing and amendments: live Friday 30 October. Choice B, The Flagship, recommended: RM25,000, RM27,000 with SST: the Corporate Website, RM20,000 at the founding rate (list RM40,000), and the editorial CMS, RM5,000 at the founding rate (original RM10,000), with Brand Strategy · Full, worth RM10,000, and the web identity and CI for the Arabia title, worth RM4,000, included at no charge. Complete in three weeks, on Friday 30 October, then a fourth week of amendments and fixes: live Friday 6 November. Both are in English and Arabic with true right to left, and both are billed 50 / 30 / 20: Choice A RM8,100, RM4,860 and RM3,240 with SST; Choice B RM13,500, RM8,100 and RM5,400 with SST. Every date assumes a decision and the first payment by Friday 9 October and a kickoff on Monday 12 October, and moves day for day with your acceptance. The proposal is valid to Wednesday 4 November 2026. Zoom and scroll the timeline; the blue line is today.</div>';

  buildChart();
  (function(){ var sc0=scroller(); if(!sc0||!PROJECT.autoFit) return; var avail=sc0.clientWidth-lblw()-4, need=TOTAL*ZOOM[level];
    if(avail>0 && (need<=avail || avail/need>=PROJECT.autoFit)){ zoomMul=avail/need; buildChart(); } })();

  /* zoom controls */
  document.getElementById('zseg').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) setLevel(b.getAttribute('data-lv')); });
  document.getElementById('btnToday').addEventListener('click',function(){ scrollToDate((TODAY>=S&&TODAY<=E)?TODAY:S,0.5); });
  document.getElementById('btnFit').addEventListener('click',function(){ level='months'; zoomMul=1; buildChart(); var sc=scroller(); if(sc) sc.scrollLeft=0; resetDetail(); });
  document.getElementById('zIn').addEventListener('click',function(){ zoomBy(1.25); });
  document.getElementById('zOut').addEventListener('click',function(){ zoomBy(0.8); });

  /* crosshair: exact day under cursor */
  var sc=scroller();
  function hideCross(){ var l=document.getElementById('crossLine'),c=document.getElementById('crossChip'); if(l)l.style.opacity=0; if(c)c.style.opacity=0; }
  sc.addEventListener('mousemove',function(e){
    var over=document.querySelector('.gx-over'); if(!over) return;
    var r=over.getBoundingClientRect(), x=e.clientX-r.left;
    if(x<0||x>r.width){ hideCross(); return; }
    var date=new Date(S.getTime()+Math.floor(x/ppd())*DAY);
    var l=document.getElementById('crossLine'),c=document.getElementById('crossChip');
    l.style.left=x+'px'; l.style.opacity=1;
    c.style.left=Math.max(28,Math.min(r.width-28,x))+'px'; c.textContent=fmtFull(date); c.style.opacity=1;
  });
  sc.addEventListener('mouseleave',hideCross);

  /* row detail (delegated so it survives rebuilds) */
  var gd=document.getElementById('gd'), openI=null;
  document.getElementById('chart').addEventListener('click',function(e){
    var row=e.target.closest('.grow'); if(!row) return;
    var i=+row.getAttribute('data-i'), p=PROJECT.phases[i];
    [].forEach.call(document.querySelectorAll('.grow'),function(r){ r.classList.toggle('on', r===row && openI!==i); });
    if(openI===i){ gd.classList.remove('open'); openI=null; return; }
    openI=i;
    gd.innerHTML='<div class="gd-h"><h3>'+esc(p.name)+'</h3>'
      +'<span class="gd-pill" style="background:'+STCOL[p.status]+'">'+STLABEL[p.status]+'</span>'
      +'<span class="gd-pill" style="background:'+COLOR[p.track]+'">'+TRACKNAME[p.track]+'</span>'
      +(p.choice?'<span class="gd-pill" style="background:#54565d">'+esc(p.choice)+'</span>':'')
      +'<span class="gd-dates">'+fmtFull(p._s)+' → '+fmtFull(p._e)+'</span></div>'
      +'<div class="gd-body">'+esc(p.detail)+'</div>'
      +'<div class="gd-hint">Tap the row again to close.</div>';
    gd.classList.add('open');
  });

  /* initial position + progress animation */
  scrollToDate((TODAY>=S&&TODAY<=E)?TODAY:S,0.42);
  setTimeout(function(){ var f=document.getElementById('nbf'); if(f) f.style.width=pctShown+'%'; },120);
})();
</script>

<script>
/* ---- print: always fit the ENTIRE chart on the page, whatever the on-screen zoom.
        Save as PDF must never clip a week. Reversible after printing. ---- */
(function(){
  var PRINT_W=718;   /* ~190mm of printable width at 96dpi (A4 less 10mm margins) */
  function fit(){
    var sc=document.querySelector('.gx-scroll'), inner=document.getElementById('chart');
    if(!sc||!inner) return;
    var w=inner.scrollWidth||inner.offsetWidth; if(!w) return;
    var k=Math.min(1, PRINT_W/w);
    inner.style.transformOrigin='top left';
    inner.style.transform='scale('+k+')';
    sc.style.height=Math.ceil((inner.offsetHeight||inner.scrollHeight)*k)+'px';
    sc.style.overflow='visible';
    return k;
  }
  function undo(){
    var sc=document.querySelector('.gx-scroll'), inner=document.getElementById('chart');
    if(inner){ inner.style.transform=''; inner.style.transformOrigin=''; }
    if(sc){ sc.style.height=''; sc.style.overflow=''; }
  }
  window.addEventListener('beforeprint',fit);
  window.addEventListener('afterprint',undo);
  if(window.matchMedia){ var mq=window.matchMedia('print');
    if(mq.addEventListener) mq.addEventListener('change',function(e){ e.matches?fit():undo(); }); }
  window.__bmPrintFit=fit; window.__bmPrintUndo=undo;   /* for verification */
})();
</script>
