<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero composition — pick a framing</title>
<style>
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#f3f1f8;color:#1a1426;padding:28px clamp(16px,4vw,48px)}
  h1{font-size:20px;font-weight:700;margin:0 0 4px}
  p.sub{color:#574b6e;margin:0 0 24px;font-size:14px}
  .grid{display:grid;gap:26px}
  figure{margin:0;background:#fff;border:1px solid #e6e4ec;border-radius:18px;overflow:hidden;box-shadow:0 16px 44px -28px rgba(60,30,80,.3)}
  img{display:block;width:100%}
  figcaption{padding:14px 18px}
  .tag{display:inline-block;font-weight:700;color:#5b3fa0;background:rgba(91,63,160,.1);padding:3px 10px;border-radius:999px;font-size:13px;margin-bottom:6px}
  .desc{color:#332b49;font-size:14px;line-height:1.5}
</style></head><body>
  <h1>Pick the framing for the animated hero</h1>
  <p class="sub">Both: two bottles sharp on a clean marble table (no front edge), family cooking soft and further back, locked camera. Once you choose, I animate that one.</p>
  <div class="grid">
    <figure><img src="assets/sample-a.png" alt="Option A"><figcaption><span class="tag">Option A</span><div class="desc">Bottles grouped to the right, family smaller and off to the side. Most open space on the left for the headline.</div></figcaption></figure>
    <figure><img src="assets/sample-b.jpeg" alt="Option B"><figcaption><span class="tag">Option B</span><div class="desc">Bottles centred, family larger, closer and more engaged (child laughing). Warmer, and the animation will read more clearly. Slightly less left space.</div></figcaption></figure>
  </div>
</body></html>
