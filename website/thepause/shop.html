<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop · THE PAUSE</title>
  <meta name="description" content="Shop the full edit of candles, diffusers, incense, holders and room sprays. Filter by category, mood and brand.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shop.css">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <main id="main" class="page">
    <div class="wrap">
      <section class="page-intro">
        <p class="eyebrow">The edit</p>
        <h1>Everything, <em>quietly chosen.</em></h1>
        <p>A considered edit of candles, diffusers, incense and more. Filter by the feeling you are after, the form you prefer, or the house you trust.</p>
      </section>
    </div>

    <div class="filters">
      <div class="wrap">
        <div class="filters__inner">
          <div class="filter-group filter-chips" data-cat-chips role="group" aria-label="Filter by category"></div>
          <div class="filter-group filter-chips" id="moods" data-mood-chips role="group" aria-label="Shop by mood"></div>
          <div class="filter-group filter-controls">
            <span class="page-intro__count" data-count role="status" aria-live="polite"></span>
            <select class="select" data-brand-select aria-label="Filter by brand"></select>
            <select class="select" data-sort-select aria-label="Sort">
              <option value="featured">Featured</option>
              <option value="best">Best sellers</option>
              <option value="price-asc">Price, low to high</option>
              <option value="price-desc">Price, high to low</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="product-grid shop-grid" data-grid></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script type="module" src="js/shop.js"></script>
</body>
</html>
