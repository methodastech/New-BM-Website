<!doctype html><html><head><meta charset="utf-8"><title>icons</title>
<style>body{background:#f6f5f2;font-family:monospace;padding:40px;display:grid;grid-template-columns:repeat(6,1fr);gap:28px}
.i{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;background:#fff}
.i .ic{width:72px;height:72px;color:#1d1d1f}
.d{background:#2a211a}.d .ic{color:#f6f5f2}.d span{color:#f6f5f2}
span{font-size:11px}</style></head><body>
<script type="module">
import { ICONS } from './js/icons.js';
const names = Object.keys(ICONS);
names.forEach((n,idx) => {
  const div = document.createElement('div');
  div.className = 'i' + (idx % 3 === 2 ? ' d' : '');
  div.innerHTML = ICONS[n] + '<span>' + n + '</span>';
  document.body.appendChild(div);
});
</script></body></html>
