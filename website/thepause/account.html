<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account · THE PAUSE</title>
  <meta name="description" content="Sign in to The Pause.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/quiz.css">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <main id="main" class="page">
    <div class="wrap">
      <section class="section" style="max-width:420px; margin-inline:auto; text-align:center; min-height:52vh; display:flex; flex-direction:column; justify-content:center;">
        <p class="eyebrow" style="justify-content:center;">Account</p>
        <h1 style="font-size:var(--fs-d2); margin-top:1rem;">Welcome back.</h1>
        <p style="margin:1rem auto 1.75rem;">Enter your email and we will send a quiet link to sign in. No passwords, ever.</p>
        <form class="field" onsubmit="event.preventDefault();this.insertAdjacentHTML('afterend','<p role=&quot;status&quot; class=&quot;news__thanks&quot;>Signing in is not available in this demo, so nothing was sent.</p>');this.remove();">
          <input type="email" placeholder="Your email" aria-label="Email" required>
          <button class="btn btn--sm" type="submit" aria-label="Continue"><span data-icon="arrow"></span></button>
        </form>
        <p style="margin-top:1.25rem; font-size:var(--fs-xs); color:var(--mist);">This is a demo. Orders and profiles are not connected.</p>
      </section>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script type="module" src="js/page.js"></script>
</body>
</html>
