<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESSENCE — Character Model</title>
<style>
  :root{ --grn:#9fe8b0; --dim:#8f93ad; --bg:#0b0d16; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:var(--bg); overflow:hidden; font-family:'Courier New',ui-monospace,monospace; color:#cfd4e8; }
  canvas{ display:block; }
  #hdr{ position:fixed; top:20px; left:0; right:0; text-align:center; pointer-events:none; z-index:5; }
  #hdr h1{ font-size:28px; letter-spacing:12px; color:var(--grn); text-shadow:0 0 18px rgba(140,240,170,.35); font-weight:700; }
  #hdr p{ margin-top:5px; font-size:10px; letter-spacing:4px; color:var(--dim); }
  #side{ position:fixed; left:16px; top:66px; bottom:16px; width:138px; z-index:8; display:flex; flex-direction:column; gap:4px; overflow-y:auto; padding-right:4px; }
  #side .sec{ font-size:9px; letter-spacing:3px; color:#565b74; margin:8px 0 2px 2px; }
  #side button{ font-family:inherit; font-size:10px; letter-spacing:2px; padding:7px 9px; background:rgba(20,26,40,.85); border:1px solid #2c3350; color:var(--dim); cursor:pointer; border-radius:3px; text-align:left; }
  #side button.on{ color:var(--grn); border-color:#3f6a4c; box-shadow:0 0 10px rgba(140,240,170,.12) inset; }
  #tabs{ display:flex; flex-direction:column; gap:4px; }
  #verRow,#faceRow{ display:flex; flex-wrap:wrap; gap:4px; } #verRow button,#faceRow button{ flex:1 0 36px; text-align:center; padding:6px 3px; }
  #zoomRow{ display:flex; gap:4px; } #zoomRow button{ flex:1; text-align:center; font-size:13px; }
  #sub{ position:fixed; top:122px; left:0; right:0; text-align:center; font-size:10px; letter-spacing:3px; color:var(--dim); z-index:5; pointer-events:none; }
  #hint{ position:fixed; top:144px; left:0; right:0; text-align:center; font-size:9px; letter-spacing:3px; color:#565b74; z-index:5; pointer-events:none; }
  .lbl{ position:fixed; bottom:96px; width:30%; text-align:center; pointer-events:none; z-index:5; }
  .lbl b{ display:block; font-size:12px; letter-spacing:5px; color:#e8ead8; }
  .lbl span{ display:block; margin-top:5px; font-size:9px; letter-spacing:2px; color:var(--dim); line-height:1.6; }
  #lbl1{ left:2%; } #lbl2{ left:35%; } #lbl3{ right:2%; }
  .btnrow{ position:fixed; left:0; right:0; display:flex; justify-content:center; gap:8px; z-index:6; }
  #garb{ bottom:56px; } #animBtns{ bottom:20px; }
  .btnrow button{ font-family:inherit; font-size:10px; letter-spacing:2px; padding:6px 11px; background:rgba(20,26,40,.85);
    border:1px solid #2c3350; color:var(--dim); cursor:pointer; border-radius:3px; }
  .btnrow button.on{ color:var(--grn); border-color:#3f6a4c; box-shadow:0 0 10px rgba(140,240,170,.12) inset; }
  #back{ position:fixed; top:20px; left:20px; z-index:7; font-size:10px; letter-spacing:2px; color:var(--dim); text-decoration:none; border:1px solid #2c3350; padding:7px 11px; border-radius:3px; background:rgba(20,26,40,.85); }
  #back:hover{ color:var(--grn); border-color:#3f6a4c; }
  /* (the old top-right #ver bar is retired — everything lives in the #side sidebar now) */
  #fxBloom,#fxTint,#fxVig{ position:fixed; inset:0; pointer-events:none; display:none; }
  #fxBloom{ width:100vw; height:100vh; mix-blend-mode:screen; filter:blur(14px) brightness(1.28) saturate(1.45); opacity:0.63; z-index:1; }   /* CINEMA softened ~30% (user 2026-07-15) */
  #fxTint{ z-index:2; }
  #fxVig{ background:radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(0,0,0,0.6) 100%); z-index:3; }
</style>
</head>
<body>
<a id="back" href="./index.html" onclick="this.href='./index.html?t='+Date.now()">◂ THE BONEFIELD</a>

<canvas id="fxBloom"></canvas><div id="fxTint"></div><div id="fxVig"></div>
<div id="hdr"><h1>ESSENCE</h1><p>THE RISEN CASTER — CHARACTER MODEL</p></div>
<div id="side">
  <div class="sec">MODEL</div>
  <div id="verRow">
    <button data-ver="v1" class="on">V1</button><button data-ver="v1b">V1.1</button><button data-ver="v1c">V1.2</button><button data-ver="v2">V2</button><button data-ver="v3">V3</button>
    <button data-ver="v4">V4</button><button data-ver="v5">V5</button><button data-ver="v6">V6</button><button data-ver="v7">V7</button>
  </div>
  <div id="polyInfo" style="font-size:9px;letter-spacing:1px;color:#7ee8a2;margin:3px 0 0 2px"></div>
  <div class="sec">CHARACTER</div>
  <div id="tabs">
    <button data-v="simple" class="on">SIMPLE</button>
    <button data-v="detail">DETAIL</button>
    <button data-v="homage">HOMAGE</button>
    <button data-v="knight">KNIGHT</button>
    <button data-v="wizard">WATER MAGE</button>
    <button data-v="archmage">ARCHMAGE</button>
    <button data-v="angel">ANGEL</button>
    <button data-v="cyclops">CYCLOPS</button>
    <button data-v="fireskull">FIRE SKULL</button>
  </div>
  <div class="sec">FACE</div>
  <div id="faceRow">
    <button data-face="auto" class="on">AUTO</button><button data-face="neutral">NEUT</button><button data-face="happy">HAPPY</button><button data-face="sad">SAD</button><button data-face="angry">ANGRY</button><button data-face="meh">MEH</button><button data-face="laugh">LAUGH</button><button data-face="shock">SHOCK</button><button data-face="smug">SMUG</button>
  </div>
  <div class="sec">INFO</div>
  <div id="charInfo" style="font-size:9px;letter-spacing:0.4px;color:#9fb0c8;line-height:1.55;margin:2px 0 0 2px"></div>
  <div class="sec">FILTER</div><button id="pixBtn">OFF</button>
  <div class="sec">LOOK</div><button id="lookBtn">OFF</button>
  <div class="sec">DEBUG</div>
  <button id="rigBtn">RIG · OFF</button>
  <button id="hitBtn">HITBOX · OFF</button>
  <div class="sec">ZOOM</div>
  <div id="zoomRow"><button id="zoomIn">+</button><button id="zoomOut">−</button></div>
</div>
<div id="sub">GAME MODEL — exactly what the bonefield renders</div>
<div id="hint">DRAG TO TURN · WHEEL TO CLOSE IN</div>
<div class="lbl" id="lbl1" style="display:none"><b>BARE</b><span></span></div>
<div class="lbl" id="lbl2"><b>THE CHARACTER</b><span>toggle what it wears &middot; pick a gait</span></div>
<div class="lbl" id="lbl3" style="display:none"><b>IN MOTION</b><span></span></div>
<div class="btnrow" id="garb"></div>
<div class="btnrow" id="animBtns">
  <button data-a="idle" class="on">IDLE</button>
  <button data-a="run">RUN</button>
  <button data-a="dash">DASH</button>
  <button data-a="melee">MELEE ×3</button>
</div>

<script src="./three.global.js"></script>
<script>
// ============ ESSENCE character viewer ============
// TABS = design level (SIMPLE game rig · HIGH DETAIL · HOMAGE). Every tab shows the SAME trio:
// bare model, geared model, and an animation actor (idle/run/dash/melee) — all on one page.
// The SIMPLE rig is COPIED from index.html buildSkeleton + wearables (2026-07-13) — re-copy if the game model changes.
// The HOMAGE rig is an ORIGINAL model in the old-norse dungeon spirit (hunched, ragged, pale-eyed) — no game assets used.
// All rigs share ONE joint interface (spine/neck/arm.sh|el|hand/leg.hip|knee), so one animation grammar drives all three.
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b0d16); scene.fog=new THREE.Fog(0x0b0d16,8,18);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,50);
const CAM={y:1.55,z:5.7}; const LOOK=new THREE.Vector3(0,0.95,0);
camera.position.set(0,CAM.y,CAM.z); camera.lookAt(LOOK);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);
// ---- PIXEL FILTER (user ruling 2026-07-15): render the 3D into a SMALL backing buffer and let the browser upscale it
// with nearest-neighbour (image-rendering:pixelated) → a chunky pixel-art look over the models. Toggleable on the page.
// A SPECTRUM, not a switch: SOFT is the Valheim-style low-res BLUR (no grid), FINE/PIXEL/CHUNKY are nearest-neighbour
// pixel grids of rising block size. This is how you find the one that fits — flip through and look.
const PIX_MODES=[
  {name:'OFF',    div:1,   smooth:true },   // native, crisp
  {name:'SOFT',   div:1.7, smooth:true },   // gentle low-res, softened (the Valheim feel — no visible pixels)
  {name:'FINE',   div:2,   smooth:false},   // a light pixel crunch, detail mostly intact
  {name:'PIXEL',  div:3,   smooth:false},   // clearly pixel-art, still readable
  {name:'CHUNKY', div:5,   smooth:false} ]; // full lo-fi / PS1
let pixIdx=0;
function applyRes(){ const m=PIX_MODES[pixIdx];
  if(pixIdx===0){ renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight,true); renderer.domElement.style.imageRendering='auto'; return; }
  renderer.setPixelRatio(1);
  renderer.setSize(Math.max(1,Math.ceil(innerWidth/m.div)),Math.max(1,Math.ceil(innerHeight/m.div)),false);   // small buffer, CSS left full
  const c=renderer.domElement; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px'; c.style.imageRendering=m.smooth?'auto':'pixelated'; }
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); applyRes(); sizeBloom(); });
// ---- LOOKS (user ruling 2026-07-15: two filters that are FANTASTIC for this game) ----
// CINEMA: real glow — the render is copied each frame into a quarter-res canvas with darks crushed, blurred wide and
// SCREEN-blended back, so everything emissive (eyes, hearts, crystals, magic) BLOOMS; plus a soft-light film grade and a
// vignette. MOONLIT: a cool blue night haze lifted over the scene, desaturated — the Valheim night. Both pure overlay, ~free.
const LOOKS=['OFF','CINEMA','MOONLIT']; let lookIdx=0;
const fxBloom=document.getElementById('fxBloom'), fxTint=document.getElementById('fxTint'), fxVig=document.getElementById('fxVig');
const bloomCtx=fxBloom.getContext('2d');
function sizeBloom(){ fxBloom.width=Math.max(1,Math.ceil(innerWidth/4)); fxBloom.height=Math.max(1,Math.ceil(innerHeight/4)); }
sizeBloom();
function applyLook(){ const L=LOOKS[lookIdx], cv=renderer.domElement;
  fxVig.style.display=L==='OFF'?'none':'block';
  fxTint.style.display=L==='OFF'?'none':'block';
  fxBloom.style.display=L==='CINEMA'?'block':'none';
  if(L==='CINEMA'){ cv.style.filter='contrast(1.08) saturate(1.11) brightness(1.02)';
    fxTint.style.background='linear-gradient(180deg, rgba(48,80,140,0.08), rgba(255,178,92,0.06))'; fxTint.style.mixBlendMode='soft-light'; fxVig.style.opacity='0.8'; }
  else if(L==='MOONLIT'){ cv.style.filter='saturate(0.68) contrast(1.06) brightness(1.05)';
    fxTint.style.background='linear-gradient(180deg, rgba(118,150,235,0.2), rgba(58,76,140,0.1))'; fxTint.style.mixBlendMode='screen'; fxVig.style.opacity='0.65'; }
  else cv.style.filter='none'; }

scene.add(new THREE.AmbientLight(0xbfc8ff,0.5));
const key=new THREE.DirectionalLight(0xfff4e0,1.0); key.position.set(2.6,3.6,2.8); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.left=-5; key.shadow.camera.right=5; key.shadow.camera.top=5; key.shadow.camera.bottom=-5; scene.add(key);
const rim=new THREE.DirectionalLight(0x9fc0ff,0.55); rim.position.set(-2.5,2.2,-3); scene.add(rim);

// ---- the game's materials, verbatim ----
const toonGradient=new THREE.DataTexture(new Uint8Array([70,150,255]),3,1,THREE.RedFormat);
toonGradient.minFilter=toonGradient.magFilter=THREE.NearestFilter; toonGradient.needsUpdate=true;
const flat=(color,extra)=>new THREE.MeshToonMaterial(Object.assign({color,gradientMap:toonGradient},extra||{}));
const M={ bone:flat(0xd9d2c0), boneDim:flat(0xb8b0a0), cloak:flat(0x2c2438), cloakHem:flat(0x3d3352), wood:flat(0x4a3a28), stoneDark:flat(0x3c3f48),
  iron:new THREE.MeshStandardMaterial({color:0x6a6f7a,flatShading:true,roughness:0.5,metalness:0.4}) };
const MGROBE=flat(0x262138), MGROBE2=flat(0x161226), WIZHATBAND=flat(0xe8c874);   // DARK wizard vestments (user ruling 2026-07-14): near-black violet-indigo over a deeper underlayer, thin antique gold — a risen skeleton's robe, not a royal court's
const BOOTGOLD=flat(0xf6d888); BOOTGOLD.emissive.setHex(0x8a6516);
const BOOTWING=flat(0xfff4d0); BOOTWING.emissive.setHex(0xb89a40);
const box=(w,h,d,mat,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x||0,y||0,z||0);m.castShadow=true;return m;};

// ============ SIMPLE RIG (the game's buildSkeleton) — V1 boxy · V2 rounded (both kept, user ruling 2026-07-15) ============
let SKELV='v1';   // DEFAULT = V1 (user ruling 2026-07-15) — the game's model. All other versions stay one click away.
function buildSkeleton(o){ o=o||{}; if(SKELV==='v5')return buildSkinnedSkeleton(o); if(SKELV==='v6')return buildProSkeleton(o);   // V5 skinned · V6 PRO RIG (user reference 2026-07-15: multi-spine, clavicles, pelvis root)
  const g=new THREE.Group(); const B={root:g}; const V2=(SKELV==='v2'||SKELV==='v3'), V3=(SKELV==='v3'), V7=(SKELV==='v7'), V4=(SKELV==='v4'||V7), V1C=(SKELV==='v1c'), V1B=(SKELV==='v1b'), V1O=(SKELV==='v1');   // V1 upgrade (user 2026-07-15): a neck, a taller head, rigged ankles — the boxy charm stays
  if(V1O){ B.faceW=0.225; B.faceHt=0.235; B.faceZ=0.121; B.faceY=0.014; }   // V1's face sits INSIDE the skull's edges — top, bottom and sides (user 2026-07-15: overlapped below the chin)   // V1.2 = V1's OWN boxes (user ruling 2026-07-15: from V1, NOT V1.1) + human head + a few extra surfaces + neck + ankle/toe   // V7 = V4 + neck + long skull · V1.1 = V1's OWN parts, 3× the surfaces (user ruling 2026-07-15: "not adding more parts, make the parts more detailed")
  function box(w,h,d,mat,x,y,z){ if(V1B)return bx12(w,h,d,mat,x,y,z,0.3);   // V1.1 (user 2026-07-15: "not 18, 12"): bevel only along the long axis — subtler, boxier
    if(V1C)return bx12(w,h,d,mat,x,y,z,0.16);   // V1.2: V1's boxes with a FAINT long-axis bevel — two-or-so extra reads per part, still V1
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x||0,y||0,z||0); m.castShadow=true; return m; }
  const bx12=(w,h,d,mat,x,y,z,rnd)=>{   // V1.1's cut: ONLY the 4 edges running along the part's LONG axis are bevelled — flat ends, flat faces, ~12 surfaces
    const geo=new THREE.BoxGeometry(w,h,d,2,2,2).toNonIndexed(); const p=geo.attributes.position; const v=new THREE.Vector3();
    const hw=w/2,hh=h/2,hd=d/2; const long=(h>=w&&h>=d)?'y':(w>=d?'x':'z');
    const cc=(rnd||0.3)*(long==='y'?Math.min(hw,hd):long==='x'?Math.min(hh,hd):Math.min(hw,hh));
    for(let i=0;i<p.count;i++){ v.set(p.getX(i),p.getY(i),p.getZ(i));
      const ex=Math.abs(Math.abs(v.x)-hw)<1e-5, ey=Math.abs(Math.abs(v.y)-hh)<1e-5, ez=Math.abs(Math.abs(v.z)-hd)<1e-5;
      const cx=(long!=='x'&&ex), cy=(long!=='y'&&ey), cz=(long!=='z'&&ez);
      if((cx?1:0)+(cy?1:0)+(cz?1:0)===2){ if(cx)v.x-=Math.sign(v.x)*cc; if(cy)v.y-=Math.sign(v.y)*cc; if(cz)v.z-=Math.sign(v.z)*cc; }
      p.setXYZ(i,v.x,v.y,v.z); }
    geo.computeVertexNormals(); const m=new THREE.Mesh(geo,mat); m.position.set(x||0,y||0,z||0); m.castShadow=true; return m; };   // V3 = the LOW-POLY REFERENCE build · V4 = BOXY+ (user ruling 2026-07-15: V1's charm, ~2x the surfaces to detail it out)
  const cylB=(rT,rB,h,mat,x,y,z,seg)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(rT,rB,h,seg||7),mat); m.position.set(x||0,y||0,z||0); m.castShadow=true; return m; };
  const ballB=(r,mat,x,y,z)=>{ const m=new THREE.Mesh(new THREE.SphereGeometry(r,8,6),mat); m.position.set(x||0,y||0,z||0); m.castShadow=true; return m; };
  const skull4=(LONG)=>{   // LONG (V7): the HUMAN skull — taller box, one more horizontal band, no new parts (user ruling 2026-07-15)
    const hw=LONG?0.125:0.14, hh=LONG?0.16:0.135, hd=LONG?0.125:0.13, cc=LONG?0.028:0.03;
    const geo=new THREE.BoxGeometry(hw*2,hh*2,hd*2,2,LONG?4:3,2).toNonIndexed(); const p=geo.attributes.position; const v=new THREE.Vector3();
    for(let i=0;i<p.count;i++){ v.set(p.getX(i),p.getY(i),p.getZ(i));
      const ex=Math.abs(Math.abs(v.x)-hw)<1e-5, ey=Math.abs(Math.abs(v.y)-hh)<1e-5, ez=Math.abs(Math.abs(v.z)-hd)<1e-5;
      if((ex?1:0)+(ey?1:0)+(ez?1:0)>=2){ if(ex)v.x-=Math.sign(v.x)*cc; if(ey)v.y-=Math.sign(v.y)*cc; if(ez)v.z-=Math.sign(v.z)*cc; }   // FLAT faces, crisp 45° bevels only
      const yn=v.y/hh;
      if(LONG){
        if(yn<0.5){ const j=(0.5-yn)/1.5; v.x*=1-0.42*j; }                       // the FACE: temples taper steadily from the brow down to the chin
        if(yn<0&&v.z<0){ v.z*=1-0.42*(-yn); }                                    // the OCCIPUT: the back of the head pulls in toward the jaw hinge
        if(yn<-0.5&&v.z>0){ const j=(yn+0.5)/(-0.5); v.z*=1-0.2*j; }             // the CHIN: the front steps back below the jaw line
      } else if(yn<-0.3){ const j=(yn+0.3)/(-0.7); v.x*=1-0.3*j; v.z*=1-0.18*j; }   // V4's jaw band, untouched
      p.setXYZ(i,v.x,v.y,v.z); }
    geo.computeVertexNormals(); const m=new THREE.Mesh(geo,M.bone); m.castShadow=true; return m; };
  const skullV11=()=>{   // V1.1 (user reference render 2026-07-15): the low-poly SKELETON skull — domed crown, brow, tapered jaw, a chin
    const hw=0.135,hh=0.15,hd=0.128;
    const geo=new THREE.BoxGeometry(hw*2,hh*2,hd*2,3,4,3).toNonIndexed(); const p=geo.attributes.position; const v=new THREE.Vector3();
    for(let i=0;i<p.count;i++){ v.set(p.getX(i),p.getY(i),p.getZ(i));
      const yn=v.y/hh;
      if(yn>0.3){ const j=(yn-0.3)/0.7; const sh=1-0.5*j*j; v.x*=sh; v.z*=sh; }
      if(yn<0.15){ const j=(0.15-yn)/1.15; v.x*=1-0.42*j; }
      if(yn<0.05&&v.z<0){ v.z*=1-0.4*(0.05-yn); }
      if(yn<-0.45&&v.z>0){ const j=(yn+0.45)/(-0.55); v.z-=0.028*j; v.x*=1-0.25*j; }
      if(yn>-0.1&&yn<0.35&&v.z>hd*0.55){ v.z+=0.014; }
      p.setXYZ(i,v.x,v.y,v.z); }
    geo.computeVertexNormals(); const m=new THREE.Mesh(geo,M.bone); m.castShadow=true; return m; };
  const bx4=(w,h,d,mat,x,y,z,rnd,tap,waist)=>{   // V4's SCULPTED BOX (user ruling 2026-07-15: "more surfaces ON the box, not more parts"):
    // the box subdivided 2×2×2, corners blended toward the ellipsoid (chamfer), optionally tapering toward the foot — same charm, shaped
    const geo=new THREE.BoxGeometry(w,h,d,2,2,2).toNonIndexed(); const p=geo.attributes.position; const v=new THREE.Vector3();
    const hw=w/2,hh=h/2,hd=d/2, cc=(rnd===undefined?0.35:rnd)*Math.min(hw,hh,hd);   // NOT ROUND (user ruling 2026-07-15): a fixed EDGE BEVEL —
    for(let i=0;i<p.count;i++){ v.set(p.getX(i),p.getY(i),p.getZ(i));               // faces stay dead FLAT, only edges and corners take the 45° cut
      const ex=Math.abs(Math.abs(v.x)-hw)<1e-5, ey=Math.abs(Math.abs(v.y)-hh)<1e-5, ez=Math.abs(Math.abs(v.z)-hd)<1e-5;
      if((ex?1:0)+(ey?1:0)+(ez?1:0)>=2){ if(ex)v.x-=Math.sign(v.x)*cc; if(ey)v.y-=Math.sign(v.y)*cc; if(ez)v.z-=Math.sign(v.z)*cc; }
      if(tap){ const t=1-tap*(0.5-v.y/h); v.x*=t; v.z*=t; }
      if(waist&&Math.abs(v.y)<h*0.26){ v.x*=waist; v.z*=waist; }
      p.setXYZ(i,v.x,v.y,v.z); }
    geo.computeVertexNormals();
    const m=new THREE.Mesh(geo,mat); m.position.set(x||0,y||0,z||0); m.castShadow=true; return m; };

// ============ BLADE TRAIL — the crescent that follows the sword (Valheim / arcade-fighter style) ============
// A ribbon stitched between the blade's BASE and TIP, sampled every frame of a swing. The newest rung is bright,
// the oldest fades to nothing, so the arc of the cut hangs in the air for a moment behind the steel.
// (Declared ABOVE the stages: makeStage() calls makeTrail(), so TRAIL_LEN must already be initialised, not in its TDZ.)
const TRAIL_LEN=12;                      // ~0.2 s of arc — long enough to read the cut, short enough not to smear the fighter
const TRAIL_IN=0.34, TRAIL_OUT=0.70;     // the ribbon spans only the OUTER half of the blade: a thin crescent, not a wedge fanning out of the fist
function makeTrail(parent,color){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(TRAIL_LEN*2*3),3));
  geo.setAttribute('color',   new THREE.BufferAttribute(new Float32Array(TRAIL_LEN*2*3),3));
  const idx=[]; for(let i=0;i<TRAIL_LEN-1;i++){ const a=i*2,b=i*2+1,c=(i+1)*2,d=(i+1)*2+1; idx.push(a,b,c, b,d,c); }
  geo.setIndex(idx);
  const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.8,
    side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));   // additive: a faded rung adds nothing, so black IS invisible
  mesh.frustumCulled=false; mesh.renderOrder=6; parent.add(mesh);
  return {mesh,geo,parent,pts:[],col:new THREE.Color(color)}; }
const _tb=new THREE.Vector3(), _tt=new THREE.Vector3();
function trailSample(tr,sword,live){   // live: the blade is mid-cut — otherwise the ribbon eats itself and vanishes
  if(live){ sword.updateWorldMatrix(true,false);
    const ei=sword.userData.eIn!==undefined?sword.userData.eIn:TRAIL_IN, eo=sword.userData.eOut!==undefined?sword.userData.eOut:TRAIL_OUT;   // the ribbon reads the STEEL's own edge (user 2026-07-15: the glow must match the blade)
    _tb.set(0,ei+(eo-ei)*0.45,0).applyMatrix4(sword.matrixWorld);
    _tt.set(0,eo+0.02,0).applyMatrix4(sword.matrixWorld);   // just past the point, so the arc's leading edge sits on the steel
    tr.parent.worldToLocal(_tb); tr.parent.worldToLocal(_tt);   // the ribbon lives in the actor's own space, so a turning stage can't smear it
    tr.pts.push([_tb.clone(),_tt.clone()]); if(tr.pts.length>TRAIL_LEN)tr.pts.shift(); }
  else if(tr.pts.length)tr.pts.shift();   // not swinging: the ribbon eats itself from the tail until it's gone
  const P=tr.geo.attributes.position.array, C=tr.geo.attributes.color.array, n=tr.pts.length;
  for(let i=0;i<TRAIL_LEN;i++){
    const p=i<n?tr.pts[n-1-i]:(n?tr.pts[0]:null), o=i*6;
    if(!p){ for(let j=0;j<6;j++){P[o+j]=0;C[o+j]=0;} continue; }
    P[o]=p[0].x;P[o+1]=p[0].y;P[o+2]=p[0].z; P[o+3]=p[1].x;P[o+4]=p[1].y;P[o+5]=p[1].z;
    const f=Math.pow(1-i/(TRAIL_LEN-1),1.7);   // the newest rung burns brightest, the tail dies out
    C[o]=tr.col.r*f*0.08; C[o+1]=tr.col.g*f*0.08; C[o+2]=tr.col.b*f*0.08;   // the inner rail is nearly dark — the glow lives out at the EDGE, so it reads as an arc of light, not a painted slab
    C[o+3]=tr.col.r*f; C[o+4]=tr.col.g*f; C[o+5]=tr.col.b*f; }
  tr.geo.attributes.position.needsUpdate=true; tr.geo.attributes.color.needsUpdate=true;
  tr.mesh.visible=n>1; }

if(KPLUME.emissive)KPLUME.emissive.setHex(0x1a12b8); if(KPLUME2.emissive)KPLUME2.emissive.setHex(0x0e0880);
const WIZROBE=flat(0x2f5aa8), WIZROBE2=flat(0x1b2f5e), WIZSKIN=flat(0xca9c76), WIZPANTS=flat(0x233150), WIZBOOT=flat(0x241d16), WIZBEARD=flat(0xcfc9bd);
const WMROBE=flat(0x4f9a52), WMROBE2=flat(0x2c5e30), WMBAND=flat(0xe6f2c0), WMSKIN=flat(0xd8b48a), WMBEARD=flat(0xeef0e0);

// ---- SOFT BITS (feathers, beards, tabards): springs driven by the anchor's real world-motion ----
const softBits=[];
const _sbP=new THREE.Vector3(),_sbQ=new THREE.Quaternion(),_sbS=new THREE.Vector3(),_sbW=new THREE.Vector3(),_sbV=new THREE.Vector3(),_sbQi=new THREE.Quaternion();
function registerSoft(pivot,opt){ opt=opt||{}; const s={pivot,rx0:pivot.rotation.x,rz0:pivot.rotation.z,vx:0,vz:0,init:false,wx:0,wy:0,wz:0,k:opt.k||130,d:opt.d||10,move:opt.move||7,ph:opt.ph||0,fl:opt.fl!==undefined?opt.fl:0.03,grav:opt.grav||0,rootRef:opt.rootRef||null}; softBits.push(s); return s; }
function updateSoft(t,dt){ const h=Math.min(0.033,dt||0.016);
  for(const s of softBits){ const pv=s.pivot,p=pv.parent; if(!p){ s.vx*=0.7; s.vz*=0.7; continue; }
    // THE TURNTABLE IS NOT MOTION (workbench-only, 2026-07-15): measure the bit's velocity in the PEDESTAL's frame, so the
    // steady display spin is cancelled and the bits react ONLY to the model's own animation (run, dash, melee) — the drape
    // presents symmetric while it rotates. The game keeps world-frame velocity so its cloth still trails real turns.
    const ped=s.rootRef?s.rootRef.parent:null;
    pv.getWorldPosition(_sbW); if(ped)ped.worldToLocal(_sbW);
    if(!s.init){ s.wx=_sbW.x;s.wy=_sbW.y;s.wz=_sbW.z;s.init=true; }
    _sbV.set((_sbW.x-s.wx)/h,(_sbW.y-s.wy)/h,(_sbW.z-s.wz)/h); s.wx=_sbW.x;s.wy=_sbW.y;s.wz=_sbW.z;
    if(_sbV.lengthSq()>2500)_sbV.multiplyScalar(0);
    if(!ped){ p.matrixWorld.decompose(_sbP,_sbQ,_sbS); _sbQi.copy(_sbQ).invert(); _sbV.applyQuaternion(_sbQi); }   // pedestal-local velocity already faces model-forward; world-frame needs the parent transform
    const tx=s.rx0+_sbV.z*s.move*0.02+s.grav+Math.sin(t*3.1+s.ph)*s.fl, tz=s.rz0-_sbV.x*s.move*0.02+Math.sin(t*2.3+s.ph+1)*s.fl*0.7;
    s.vx+=((tx-pv.rotation.x)*s.k-s.vx*s.d)*h; s.vz+=((tz-pv.rotation.z)*s.k-s.vz*s.d)*h;
    pv.rotation.x+=s.vx*h; pv.rotation.z+=s.vz*h; } }

// ---- soft cloth CHAINS (cape + robe skirt): hinged segments, each a damped spring ----
function capeChain(parent,widths,segH,depth,mat,hemMat){ const segs=[];
  for(const col of[-1,1]){ let hold=parent;
    for(let ci=0;ci<widths.length;ci++){ const w2=widths[ci]/2; const gg=new THREE.Group(); gg.position.y=ci===0?0:-segH; hold.add(gg);
      const mm=new THREE.Mesh(new THREE.BoxGeometry(w2-0.005,segH+0.02,depth),mat); mm.position.set(col*w2/2,-segH/2,0); mm.castShadow=true; gg.add(mm);
      if(hemMat&&ci===widths.length-1){ const hh=new THREE.Mesh(new THREE.BoxGeometry(w2+0.02,0.07,depth+0.02),hemMat); hh.position.set(col*w2/2,-segH-0.01,0); gg.add(hh); }
      segs.push({g:gg,v:0,u:0,row:ci,ph:ci*1.35+(col>0?0.9:0),curl:-0.045*ci,rz0:col*0.045}); hold=gg; } }
  return segs; }
function skirtChain(parent,rings,mat){ const segs=[]; let hold=parent;
  for(let ri=0;ri<rings.length;ri++){ const rt=rings[ri][0],rb=rings[ri][1],hh=rings[ri][2]; const gg=new THREE.Group(); gg.position.y=ri===0?0:-(rings[ri-1][2]-0.04); hold.add(gg);
    const cyl=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,hh,12),mat); cyl.position.y=-hh/2; cyl.castShadow=true; gg.add(cyl);
    segs.push({g:gg,v:0,u:0,row:ri,ph:ri*1.35,curl:0.03*ri,rz0:0,skirt:true}); hold=gg; }
  return segs; }
function driveChain(segs,amp,spd,dash,t){ if(!segs)return;
  for(let i=0;i<segs.length;i++){ const c=segs[i], row=c.row, ph=c.ph;
    const tx=(c.curl)+Math.sin(t*(5.2+row*1.8)+ph)*amp*(0.25+spd*1.4)-(dash?0.14*(row+1):0)-spd*0.05*row;
    c.v+=((tx-c.g.rotation.x)*150-c.v*8)*0.016; c.g.rotation.x+=c.v*0.016;
    const clampIn=c.skirt?0.45:0.1; if(c.g.rotation.x>clampIn){ c.g.rotation.x=clampIn; if(c.v>0)c.v=0; }
    const tz=(c.rz0||0)+Math.sin(t*(4.3+row*1.3)+ph*0.83+1.1)*amp*0.7*(0.3+spd);
    c.u+=((tz-c.g.rotation.z)*130-c.u*9)*0.016; c.g.rotation.z+=c.u*0.016;
    if(c.g.rotation.z>0.6){c.g.rotation.z=0.6;if(c.u>0)c.u=0;}else if(c.g.rotation.z<-0.6){c.g.rotation.z=-0.6;if(c.u<0)c.u=0;} } }
function driveCloth(B,spd,dash,t){ if(B.capeSegs)driveChain(B.capeSegs,0.15,spd,dash,t); if(B.skirtSegs)driveChain(B.skirtSegs,0.07,spd,dash,t); }

// ---------- REAL VERLET CLOTH (ported from the game's dark cape, user 2026-07-16: "the cloth should flow exactly like that") ----------
// A coarse simulated sheet — pleated so it MUST fold, colliding with body spheres so it can NEVER enter the body.
const cloths=[];
function makeCloth(baseMat,W,H,width,len,pleatTop,pleatHem,tube){   // pleat GRADES down the sheet — tight at the anchor, gathered at the hem — and the hem row FLARES 1.05
  const m2=baseMat.isMeshStandardMaterial?baseMat:new THREE.MeshStandardMaterial({color:baseMat.color.clone(),roughness:0.97,metalness:0,side:THREE.DoubleSide});
  const geo=new THREE.PlaneGeometry(width,len,W-1,H-1);
  { const n=geo.attributes.position.count; geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(n*3).fill(1),3)); }   // per-vertex shade — free hem/seam darkening
  const mesh=new THREE.Mesh(geo,m2); mesh.castShadow=true; mesh.receiveShadow=true; mesh.frustumCulled=false; scene.add(mesh);
  const N=W*H, pts=new Float32Array(N*3), prev=new Float32Array(N*3), cons=[];
  const id=(x,y)=>y*W+x, sx=width/(W-1), sy=len/(H-1), pT=pleatTop||1, pH=pleatHem!==undefined?pleatHem:pT;
  const pl=y=>(pT+(pH-pT)*(H>1?y/(H-1):0))*(y===H-1?1.05:1);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){   // the PLEAT TRICK, now per-row: shorter horizontal rests force standing folds, more of them toward the hem
    if(x<W-1)cons.push([id(x,y),id(x+1,y),sx*pl(y)]);

const easeOut=k=>1-Math.pow(1-k,3);
function poseDash(B,t){ const p=(t%1.3)/1.3;

    B.arm.l.sh.rotation.x=-1.05*k; B.arm.l.el.rotation.x=-0.9;   // SPRINT arms, not superman arms (user ruling 2026-07-14): left arm pumps forward, bent hard — opposite the leading right leg
    B.arm.r.sh.rotation.x=0.7*k; B.arm.r.el.rotation.x=-0.6;     // right arm drives back

function swingPhases(p,sf){ sf=sf||0.4; const kIn=p<sf?Math.pow(p/sf,3):1, kOut=p<sf?0:1-Math.pow(1-(p-sf)/(1-sf),3); return [kIn,kOut]; }

  if(kOut<=0)return SW_HOLD+(SW_COCK-SW_HOLD)*kIn;                       // the raise: the blade lies back over the shoulder
  const s=SW_COCK+(SW_CUT-SW_COCK)*Math.min(1,kOut*1.8);                 // the drive: the edge WHIPS ahead of the arm into the cut line
  return s+(SW_HOLD-s)*Math.max(0,(kOut-0.72)/0.28); }                   // the recovery: the point comes back up to the guard, never left in the dirt
// A CUT IS A WHOLE BODY, NOT AN ARM (user ruling 2026-07-14, against a fighting-game sprite sheet).
// The old melee left the legs planted flat and the torso square while the arm flailed — a mannequin waving a stick.
// Every hit now runs: FIGHTING STANCE → coil away from the target (weight back, blade cocked) → UNWIND through it
// with a stepping lunge (hips and spine whip, the body TRAVELS forward) → recover to the stance.
//   C = the coil, peaks the instant before the cut and decays as the body unwinds
//   S = the strike travelling through, rising fast then easing back so the fighter recovers instead of freezing mid-follow-through
function swingWeights(p,sf){ const [kIn,kOut]=swingPhases(p,sf);
  const thru=Math.min(1,kOut*1.6);                 // the strike EXPLODES out of the coil — it does not ease politely
  const C=kIn*(1-thru);                            // …and the coil is SPENT into it, so the body isn't still half-wound at impact
  const r=Math.max(0,(p-0.72)/0.28);               // recovery is timed off the hit's own clock, not off kOut (which saturates almost instantly,
  const S=thru*(1-r);                              // yanking the fighter back before the cut had even landed)
  return [C,S]; }
function poseMelee(B,t){ const cyc=t%2.7; let strike=null; let sw=SW_HOLD;

  B.arm.r.sh.rotation.x=-0.28; B.arm.r.el.rotation.x=-0.5;
  B.arm.l.sh.rotation.x=-0.15; B.arm.l.sh.rotation.z=0.15; B.arm.l.el.rotation.x=-0.6;
  B.leg.l.hip.rotation.x=-0.34; B.leg.l.knee.rotation.x=0.3; B.leg.l.hip.rotation.z=-0.18;   // lead leg forward, planted WIDE (user 2026-07-15: feet were overlapping)

    if(B.eyes){ const sq=((t+bi*1.3)%3.7)<0.11?0.12:1; for(const e of B.eyes)e.scale.y=sq; }   // a blink every few seconds — squashed to a slit for a tenth of a second, staggered per pedestal
    for(let i=0;i<B.slime.length;i++)B.slime[i].scale.setScalar(1+Math.sin(t*2.6+i*1.7)*0.1); } }
  if(S.geared.hoverHead){ const hh=S.geared.hoverHead;   // the wraith head HOVERS — bobbing at rest, lifting when the fight quickens
    hh.position.y=1.3+Math.sin(t*1.8)*0.12+(mode==='dash'?0.4:0)+(mode==='melee'?0.25:0);
    hh.rotation.y=Math.sin(t*0.7)*0.3; hh.rotation.z=Math.sin(t*1.1)*0.06;
    if(S.geared.fsCrown){ const fl=1+Math.sin(t*6.3)*0.14; S.geared.fsCrown.scale.x=S.geared.fsCrown.scale.x*0.9+fl*0.1; S.geared.fsCrown.scale.z=S.geared.fsCrown.scale.z*0.9+fl*0.1; }
    if(S.geared.fsCrown2)S.geared.fsCrown2.scale.y=S.geared.fsCrown2.scale.y*0.85+(1+Math.sin(t*8.1)*0.28)*0.15; }
  updateParts(dt);
  renderer.render(scene,camera);
  if(LOOKS[lookIdx]==='CINEMA'){ bloomCtx.filter='contrast(2.0) brightness(0.75) saturate(1.4)';   // crush the darks so only the BRIGHT survives (softened ~30%, user 2026-07-15)…
    bloomCtx.drawImage(renderer.domElement,0,0,fxBloom.width,fxBloom.height); } }   // …then CSS blurs it wide and screens it back: the glow
requestAnimationFrame(frame);
</script>
