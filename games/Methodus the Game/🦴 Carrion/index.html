<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CARRION</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0710; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; }
  #c { image-rendering: pixelated; image-rendering: crisp-edges; background: #0a0710; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const VW = 440, VH = 264;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
cv.width = VW; cv.height = VH;
let scale = 1;
function resize() { scale = Math.max(1, Math.min(innerWidth / VW, innerHeight / VH)); cv.style.width = (VW * scale) + "px"; cv.style.height = (VH * scale) + "px"; }
addEventListener("resize", resize); resize();
ctx.imageSmoothingEnabled = false;

const keys = {}; let mouse = { x: 0, y: 0, down: false };
addEventListener("keydown", e => { keys[e.code] = true; audioInit(); if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if (game.mode === "title" || game.mode === "intro") { startPlay(); }
  if (e.code === "KeyF") tryForm();
  if (e.code === "KeyR") tryRest();
});
addEventListener("keyup", e => { keys[e.code] = false; });
function toView(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / scale; mouse.y = (e.clientY - r.top) / scale; }
addEventListener("mousemove", toView);
addEventListener("mousedown", e => { toView(e); mouse.down = true; audioInit(); if (game.mode === "title" || game.mode === "intro") startPlay(); });
addEventListener("mouseup", () => mouse.down = false);

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const lerp = (a, b, t) => a + (b - a) * t;

/* ============ audio : the creature is alive, it squelches and growls ============ */
const AUDIO = { ctx: null, on: true };
function audioInit() { if (AUDIO.ctx) { if (AUDIO.ctx.state === "suspended") AUDIO.ctx.resume(); return; }
  try { AUDIO.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
function tone(f, dur, type, vol, slide) { if (!AUDIO.ctx || !AUDIO.on) return; const t = AUDIO.ctx.currentTime, o = AUDIO.ctx.createOscillator(), g = AUDIO.ctx.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AUDIO.ctx.destination); o.start(t); o.stop(t + dur + 0.02); }
function noise(dur, vol) { if (!AUDIO.ctx || !AUDIO.on) return; const t = AUDIO.ctx.currentTime, n = Math.floor(AUDIO.ctx.sampleRate * dur), buf = AUDIO.ctx.createBuffer(1, n, AUDIO.ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = AUDIO.ctx.createBufferSource(); s.buffer = buf; const g = AUDIO.ctx.createGain(); g.gain.value = vol || 0.15;
  s.connect(g); g.connect(AUDIO.ctx.destination); s.start(t); }
function sfx(n) { if (!AUDIO.ctx || !AUDIO.on) return;
  if (n === "eat") { noise(0.09, 0.10); tone(110, 0.1, "sawtooth", 0.08, 70); }
  else if (n === "crunch") { noise(0.07, 0.14); tone(90, 0.08, "square", 0.1, 50); }
  else if (n === "coin") { tone(880, 0.07, "triangle", 0.12, 1320); }
  else if (n === "growl") { tone(70, 0.5, "sawtooth", 0.2, 130); tone(52, 0.5, "sine", 0.16, 40); noise(0.3, 0.08); }
  else if (n === "bite") { noise(0.06, 0.16); tone(160, 0.08, "square", 0.14, 60); }
  else if (n === "hurt") { tone(140, 0.16, "sawtooth", 0.16, 60); }
  else if (n === "rest") { tone(196, 0.3, "sine", 0.12, 130); tone(147, 0.4, "sine", 0.1, 98); }
  else if (n === "day") { tone(330, 0.14, "triangle", 0.12); setTimeout(() => tone(440, 0.2, "triangle", 0.12), 130); }
}

/* ============ world ============ */
const POND = { x: 198, y: 80, rx: 106, ry: 58 };   // matches the painted pool in art/field.png (upper-centre, used for keep-out)
const fieldImg = new Image(); let fieldReady = false; fieldImg.onload = () => fieldReady = true; fieldImg.src = "art/field.png";
let player, bones, coins, enemies, corpses, parts, floaters, flowers, props, bg, game;
function reset() {
  player = { x: 160, y: 222, vx: 0, vy: 0, face: 1, form: "crawler", essence: 0, coins: 0, hp: 40, maxHp: 40,
    anim: 0, moving: false, eatT: 0, biteCd: 0, hurt: 0, day: 1, bounty: 0 };
  bones = [   // placed over the bones painted into the field art
    { x: 112, y: 240, kind: "human", essence: 22, max: 22 },
    { x: 322, y: 244, kind: "human", essence: 22, max: 22 },
    { x: 352, y: 60, kind: "human", essence: 22, max: 22 },
    { x: 208, y: 232, kind: "minotaur", essence: 60, max: 60 },
  ];
  coins = [];
  for (let i = 0; i < 7; i++) coins.push({ x: rnd(60, 385), y: rnd(150, 235), got: false, b: rnd(0, 6) });
  enemies = []; corpses = []; parts = []; floaters = [];
  buildField();
  game = { mode: "title", t: 0, shake: 0, dayBannerT: 0, formPrompt: false, thoughtT: 3, intro: 0 };
}
function buildField() {
  // baked grass + flowers
  bg = document.createElement("canvas"); bg.width = VW; bg.height = VH; const b = bg.getContext("2d");
  // base gradient
  const g = b.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, "#3f6e36"); g.addColorStop(1, "#345c2c"); b.fillStyle = g; b.fillRect(0, 0, VW, VH);
  // grass noise dabs
  for (let i = 0; i < 5200; i++) { const x = Math.random() * VW, y = Math.random() * VH, v = Math.random();
    b.fillStyle = v < 0.5 ? "#477b3a" : v < 0.8 ? "#3a6630" : "#56904a"; b.fillRect(x | 0, y | 0, 1, 1); }
  // flowers (the field of flowers among the bones)
  flowers = [];
  for (let i = 0; i < 130; i++) { const x = rnd(8, VW - 8), y = rnd(8, VH - 8); if (dist(x, y, POND.x, POND.y) < 50) continue;
    const c = ["#f2c0d8", "#ffe07a", "#d8a0ff", "#ff9a8a", "#fff0f0"][(Math.random() * 5) | 0];
    b.fillStyle = "#2f5526"; b.fillRect((x | 0), (y | 0) + 1, 1, 1); b.fillStyle = c; b.fillRect(x | 0, y | 0, 1, 1);
    if (Math.random() < 0.4) { b.fillStyle = c; b.fillRect((x | 0) + 1, y | 0, 1, 1); b.fillRect((x | 0) - 1, y | 0, 1, 1); } }
  // a few stones
  props = [];
  for (let i = 0; i < 5; i++) { const x = rnd(40, VW - 40), y = rnd(40, VH - 40); if (dist(x, y, POND.x, POND.y) < 56) continue; props.push({ x, y, r: rnd(4, 7) }); }
}

function startPlay() { if (game.mode === "title") { game.mode = "intro"; game.intro = 0; return; } if (game.mode === "intro") { game.mode = "play"; } }

/* ============ actions ============ */
function tryForm() {
  if (game.mode !== "play" || player.form !== "crawler") return;
  if (player.essence < 100) { thought("...not enough... eat..."); return; }
  player.essence -= 100; player.form = "hound"; player.maxHp = 90; player.hp = 90;
  game.shake = 8; sfx("growl"); thought("...a body. now I can HUNT.");
  for (let i = 0; i < 30; i++) parts.push({ x: player.x + rnd(-8, 8), y: player.y + rnd(-6, 6), vx: rnd(-60, 60), vy: rnd(-90, -10), life: rnd(0.4, 0.9), c: Math.random() < 0.5 ? "#7a1f1f" : "#caa" });
}
function tryRest() {
  if (game.mode !== "play" || enemies.length > 0) { if (enemies.length > 0) thought("...can't rest. they're here."); return; }
  // next day : bounty hunters come, scaled by the coins (wealth) in your lair
  player.day++; game.dayBannerT = 3.2; sfx("rest"); player.hp = player.maxHp; player.bounty = player.coins;
  const n = clamp(1 + Math.floor(player.coins / 4), 1, 6);
  for (let i = 0; i < n; i++) spawnHunter(i, n);
  thought("the more I hoard, the more come for my head...");
  setTimeout(() => sfx("day"), 200);
}
function spawnHunter(i, n) {
  const a = (i / n) * 6.283 + rnd(-0.3, 0.3), r = 260;
  const x = clamp(POND.x + Math.cos(a) * r, 12, VW - 12), y = clamp(POND.y + Math.sin(a) * r, 12, VH - 12);
  enemies.push({ x, y, vx: 0, vy: 0, hp: 26, maxHp: 26, dmg: 6, speed: 38, face: 1, anim: rnd(0, 6), atkCd: rnd(0.5, 1.2), flash: 0, hurt: 0 });
}
function thought(t) { floaters.push({ x: player.x, y: player.y - 18, t, life: 2.6, max: 2.6, col: "#cdbce0", think: true }); }
function floater(x, y, t, c) { floaters.push({ x, y, t, life: 1.0, max: 1.0, col: c || "#fff" }); }

/* ============ update ============ */
function update(dt) {
  game.t += dt; game.shake = Math.max(0, game.shake - dt * 30); if (game.dayBannerT > 0) game.dayBannerT -= dt;
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; if (p.life <= 0) parts.splice(i, 1); }
  for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.life -= dt; f.y -= 9 * dt; if (f.life <= 0) floaters.splice(i, 1); }
  for (const c of corpses) c.t = (c.t || 0) + dt;

  if (game.mode === "intro") { game.intro += dt; return; }
  if (game.mode !== "play") return;

  const p = player; p.biteCd = Math.max(0, p.biteCd - dt); p.hurt = Math.max(0, p.hurt - dt);
  const sp = p.form === "crawler" ? 42 : 78;
  const ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  const m = Math.hypot(ix, iy) || 1; p.moving = (ix || iy) ? true : false;
  if (p.moving) { p.x = clamp(p.x + ix / m * sp * dt, 8, VW - 8); p.y = clamp(p.y + iy / m * sp * dt, 10, VH - 6); p.anim += dt * (p.form === "crawler" ? 6 : 9); if (ix) p.face = ix > 0 ? 1 : -1; }
  // keep out of the pond a little (you crawl the bank, not the water)
  const pd = ((p.x - POND.x) / POND.rx) ** 2 + ((p.y - POND.y) / POND.ry) ** 2;
  if (pd < 0.8) { const ang = Math.atan2(p.y - POND.y, p.x - POND.x); p.x = POND.x + Math.cos(ang) * POND.rx * 0.9; p.y = POND.y + Math.sin(ang) * POND.ry * 0.9; }

  // coins : crawl over them
  for (const c of coins) { if (!c.got && dist(p.x, p.y, c.x, c.y) < 9) { c.got = true; p.coins++; sfx("coin"); floater(c.x, c.y - 6, "+1", "#ffe07a"); for (let k = 0; k < 5; k++) parts.push({ x: c.x, y: c.y, vx: rnd(-30, 30), vy: rnd(-50, -10), life: 0.4, c: "#ffe07a" }); } }

  // EATING : hold space over bones or a fresh corpse
  let onBones = null, onCorpse = null;
  for (const bp of bones) if (bp.essence > 0 && dist(p.x, p.y, bp.x, bp.y) < (bp.kind === "minotaur" ? 18 : 12)) onBones = bp;
  for (const c of corpses) if (c.essence > 0 && dist(p.x, p.y, c.x, c.y) < 12) onCorpse = c;
  const eating = keys.Space && (onBones || onCorpse);
  p.eatT = eating ? p.eatT + dt : 0;
  if (eating) {
    const src = onBones || onCorpse, drain = 26 * dt; const got = Math.min(src.essence, drain);
    src.essence -= got; p.essence += got; if (onCorpse) p.hp = Math.min(p.maxHp, p.hp + got * 0.4);
    if (Math.random() < 0.5) parts.push({ x: src.x + rnd(-6, 6), y: src.y + rnd(-4, 4), vx: rnd(-20, 20), vy: rnd(-40, -10), life: rnd(0.3, 0.6), c: Math.random() < 0.5 ? "#8effc0" : "#caa" });
    if (Math.floor(game.t * 6) !== Math.floor((game.t - dt) * 6)) sfx("crunch");
    if (src.essence <= 0 && src.max) { floater(src.x, src.y - 8, "picked clean", "#9aa"); if (onBones) sfx("eat"); }
  }

  // BITE (hound) : space when NOT eating, near an enemy
  if (p.form === "hound" && keys.Space && !onBones && !onCorpse && p.biteCd <= 0) {
    p.biteCd = 0.45; let hit = false;
    for (const e of enemies) { if (dist(p.x, p.y, e.x, e.y) < 22) { const a = Math.atan2(e.y - p.y, e.x - p.x); e.hp -= 12; e.flash = 0.1; e.hurt = 0.2; e.vx += Math.cos(a) * 120; e.vy += Math.sin(a) * 120; hit = true; for (let k = 0; k < 6; k++) parts.push({ x: e.x, y: e.y, vx: rnd(-50, 50), vy: rnd(-60, -10), life: 0.4, c: "#7a1f1f" }); } }
    sfx("bite"); if (hit) game.shake = Math.max(game.shake, 3);
    p.x += p.face * 6;
  }

  // enemies : march on the monster, bite back
  for (let i = enemies.length - 1; i >= 0; i--) { const e = enemies[i]; e.anim += dt * 5; e.flash = Math.max(0, e.flash - dt); e.hurt = Math.max(0, e.hurt - dt); e.atkCd = Math.max(0, e.atkCd - dt);
    e.x += e.vx * dt; e.y += e.vy * dt; e.vx *= Math.max(0, 1 - 6 * dt); e.vy *= Math.max(0, 1 - 6 * dt);
    const d = dist(p.x, p.y, e.x, e.y), nx = (p.x - e.x) / (d || 1), ny = (p.y - e.y) / (d || 1); e.face = nx < 0 ? -1 : 1;
    if (d > 14) { e.x += nx * e.speed * dt; e.y += ny * e.speed * dt; }
    else if (e.atkCd <= 0) { e.atkCd = 1.0; p.hp -= e.dmg; p.hurt = 0.2; game.shake = Math.max(game.shake, 4); sfx("hurt"); for (let k = 0; k < 5; k++) parts.push({ x: p.x, y: p.y, vx: rnd(-40, 40), vy: rnd(-50, -10), life: 0.4, c: "#7a1f1f" }); }
    if (e.hp <= 0) { corpses.push({ x: e.x, y: e.y, essence: 22, max: 22, t: 0, kind: "hunter" }); enemies.splice(i, 1); game.shake = Math.max(game.shake, 4); sfx("crunch"); thought("...fresh meat."); for (let k = 0; k < 12; k++) parts.push({ x: e.x, y: e.y, vx: rnd(-70, 70), vy: rnd(-80, -10), life: rnd(0.4, 0.8), c: "#7a1f1f" }); }
  }

  if (p.hp <= 0) { game.mode = "dead"; sfx("hurt"); }

  // the form prompt + intermittent hungry thoughts
  game.formPrompt = p.form === "crawler" && p.essence >= 100;
  game.thoughtT -= dt; if (game.thoughtT <= 0) { game.thoughtT = rnd(8, 16);
    if (p.form === "crawler") thought(["...so hungry...", "...bones... eat the bones...", "...build... a body...", "...the dead feed me..."][(Math.random() * 4) | 0]); }
}

/* ============ render ============ */
function render() {
  ctx.clearRect(0, 0, VW, VH);
  let sx = 0, sy = 0; if (game.shake > 0) { sx = Math.round(rnd(-game.shake, game.shake)); sy = Math.round(rnd(-game.shake, game.shake)); }
  ctx.save(); ctx.translate(sx, sy);
  if (fieldReady) ctx.drawImage(fieldImg, 0, 0, VW, VH); else { ctx.drawImage(bg, 0, 0); drawPond(); }   // the painted field (pond + bones + flowers baked in); procedural fallback before it loads
  // y-sorted: bones, coins, corpses, enemies, player
  const ents = [];
  for (const bp of bones) if (bp.essence > 0) ents.push({ y: bp.y, d: () => drawBones(bp) });
  for (const c of coins) if (!c.got) ents.push({ y: c.y, d: () => drawCoin(c) });
  for (const c of corpses) ents.push({ y: c.y, d: () => drawCorpse(c) });
  for (const e of enemies) ents.push({ y: e.y, d: () => drawHunter(e) });
  ents.push({ y: player.y, d: () => drawPlayer() });
  ents.sort((a, b) => a.y - b.y); for (const e of ents) e.d();
  for (const p of parts) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); } ctx.globalAlpha = 1;
  // soft vignette (light : the painted field already has dark edges)
  const vg = ctx.createRadialGradient(VW / 2, VH / 2, 90, VW / 2, VH / 2, 290); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(8,5,14,0.22)"); ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
  for (const f of floaters) { ctx.globalAlpha = clamp(f.life / f.max, 0, 1); pix(f.t, f.x, f.y, f.col, "center"); } ctx.globalAlpha = 1;
  ctx.restore();

  if (player.hurt > 0) { ctx.fillStyle = "rgba(150,20,20," + player.hurt + ")"; ctx.fillRect(0, 0, VW, VH); }
  drawHUD();
  if (game.mode === "title") drawTitle();
  else if (game.mode === "intro") drawIntro();
  else if (game.mode === "dead") drawDead();
}
function drawPond() {
  ctx.save(); ctx.fillStyle = "#2a1c12"; ctx.beginPath(); ctx.ellipse(POND.x, POND.y, POND.rx + 3, POND.ry + 3, 0, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(POND.x, POND.y - 6, 4, POND.x, POND.y, POND.rx); g.addColorStop(0, "#5a86b8"); g.addColorStop(1, "#2e4f78");
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(POND.x, POND.y, POND.rx, POND.ry, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.5; ctx.strokeStyle = "#bfe0ff"; ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) { const rr = ((game.t * 0.3 + i / 3) % 1); ctx.globalAlpha = 0.4 * (1 - rr); ctx.beginPath(); ctx.ellipse(POND.x, POND.y, POND.rx * rr, POND.ry * rr, 0, 0, 7); ctx.stroke(); }
  ctx.restore();
}
function shadow(x, y, r) { ctx.fillStyle = "rgba(0,0,0,0.28)"; ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.4, 0, 0, 7); ctx.fill(); }

function drawPlayer() { const p = player, bob = p.moving ? Math.round(Math.sin(p.anim * 2)) : 0;
  shadow(p.x, p.y + (p.form === "crawler" ? 4 : 6), p.form === "crawler" ? 7 : 10);
  ctx.save(); ctx.translate(p.x, p.y - bob); if (p.face < 0) ctx.scale(-1, 1);
  const fl = p.hurt > 0 && Math.floor(game.t * 30) % 2 === 0;
  if (p.form === "crawler") drawCrawler(fl); else drawHound(fl, p.moving);
  ctx.restore();
  if (p.eatT > 0) { ctx.fillStyle = "#8effc0"; for (let i = 0; i < 2; i++) { const a = game.t * 8 + i * 3; ctx.globalAlpha = 0.6; ctx.fillRect(Math.round(p.x + Math.cos(a) * 9), Math.round(p.y - 4 + Math.sin(a) * 5), 1, 1); } ctx.globalAlpha = 1; }
}
function drawCrawler(fl) { // a low, dark-red grub with a wet maw + one pale eye
  const c = fl ? "#fff" : null;
  ctx.fillStyle = c || "#5a1818"; ctx.beginPath(); ctx.ellipse(0, 0, 9, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = c || "#7a2424"; ctx.beginPath(); ctx.ellipse(-1, -1, 7, 4.5, 0, 0, 7); ctx.fill();
  // segments
  ctx.strokeStyle = c || "#3e1010"; ctx.lineWidth = 1; for (let i = -1; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 3, -4); ctx.lineTo(i * 3, 4); ctx.stroke(); }
  // maw (front, +x)
  ctx.fillStyle = c || "#2a0a0a"; ctx.beginPath(); ctx.ellipse(7, 1, 3, 2.4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = c || "#e8e0d0"; for (let i = 0; i < 3; i++) { ctx.fillRect(6 + i * 1.4, -0.5, 1, 1); ctx.fillRect(6 + i * 1.4, 2, 1, 1); } // teeth
  // eye
  ctx.fillStyle = c || "#ffe27a"; ctx.fillRect(2, -3, 2, 2); ctx.fillStyle = c || "#1a0a0a"; ctx.fillRect(3, -3, 1, 1);
}
function drawHound(fl, moving) { // a four-legged carrion hound : sinew + exposed bone, glowing eye
  const c = fl ? "#fff" : null, lp = moving ? Math.sin(player.anim) : 0;
  // legs
  ctx.strokeStyle = c || "#4a1414"; ctx.lineWidth = 2; ctx.lineCap = "round";
  for (const [bx, ph] of [[-5, 0], [-3, Math.PI], [4, Math.PI], [6, 0]]) { ctx.beginPath(); ctx.moveTo(bx, 2); ctx.lineTo(bx + Math.sin(lp + ph) * 2, 9); ctx.stroke(); }
  // body
  ctx.fillStyle = c || "#5a1818"; ctx.beginPath(); ctx.ellipse(0, 0, 11, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = c || "#7a2424"; ctx.beginPath(); ctx.ellipse(-1, -1, 9, 4.5, 0, 0, 7); ctx.fill();
  // exposed spine (bone ridge)
  ctx.fillStyle = c || "#cfc8b0"; for (let i = -3; i <= 3; i++) ctx.fillRect(i * 2, -6 + Math.abs(i) * 0.2, 1, 2);
  // head (front)
  ctx.fillStyle = c || "#7a2424"; ctx.beginPath(); ctx.ellipse(9, -1, 5, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = c || "#2a0a0a"; ctx.beginPath(); ctx.ellipse(12, 1, 3.5, 2, 0, 0, 7); ctx.fill(); // jaw
  ctx.fillStyle = c || "#e8e0d0"; for (let i = 0; i < 3; i++) { ctx.fillRect(11 + i * 1.5, 0, 1, 1); ctx.fillRect(11 + i * 1.5, 2.4, 1, 1); }
  ctx.fillStyle = c || "#ff5a3a"; ctx.fillRect(9, -3, 2, 2); // glowing eye
}
function drawBones(bp) {   // the bones are PAINTED into the field art — mark the edible ones with a soft essence glow that fades as you eat
  const left = bp.essence / bp.max, R = bp.kind === "minotaur" ? 22 : 13, pul = 0.5 + 0.5 * Math.sin(game.t * 3 + bp.x);
  ctx.save();
  const g = ctx.createRadialGradient(bp.x, bp.y, 1, bp.x, bp.y, R); g.addColorStop(0, "rgba(158,255,192," + (0.22 + pul * 0.16) * left + ")"); g.addColorStop(1, "rgba(158,255,192,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(bp.x, bp.y, R, R * 0.72, 0, 0, 7); ctx.fill();
  // a faint ring + drifting essence motes so it reads as "consumable"
  ctx.globalAlpha = (0.4 + pul * 0.3) * left; ctx.strokeStyle = "#9effc0"; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(bp.x, bp.y, R * 0.7, R * 0.5, 0, 0, 7); ctx.stroke();
  if (left > 0.05 && Math.random() < 0.14) parts.push({ x: bp.x + rnd(-R * 0.5, R * 0.5), y: bp.y, vx: rnd(-6, 6), vy: rnd(-22, -8), life: rnd(0.4, 0.8), c: "#9effc0" });
  ctx.restore();
}
function drawCorpse(c) { const fade = clamp(1 - (c.t - 20) / 6, 0, 1); ctx.save(); ctx.globalAlpha = (c.essence > 0 ? 1 : fade);
  shadow(c.x, c.y + 4, 8); ctx.fillStyle = "#5a3a3a"; ctx.beginPath(); ctx.ellipse(c.x, c.y, 8, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#7a1f1f"; ctx.beginPath(); ctx.ellipse(c.x - 2, c.y - 1, 5, 3, 0, 0, 7); ctx.fill(); ctx.restore(); }
function drawCoin(c) { const yy = c.y + Math.sin(game.t * 3 + c.b) * 1.5; ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.beginPath(); ctx.ellipse(c.x, c.y + 4, 3, 1.4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#e8c25a"; ctx.beginPath(); ctx.arc(c.x, yy, 3, 0, 7); ctx.fill(); ctx.fillStyle = "#fff2c0"; ctx.beginPath(); ctx.arc(c.x - 1, yy - 1, 1.1, 0, 7); ctx.fill(); }
function drawHunter(e) { const bob = Math.round(Math.sin(e.anim * 2)); shadow(e.x, e.y + 5, 5); ctx.save(); ctx.translate(e.x, e.y - bob); if (e.face < 0) ctx.scale(-1, 1);
  const fl = e.flash > 0; ctx.fillStyle = fl ? "#fff" : "#caa078"; ctx.fillRect(-3, -8, 6, 9); // body
  ctx.fillStyle = fl ? "#fff" : "#e8c8a0"; ctx.fillRect(-2, -12, 4, 4); // head
  ctx.fillStyle = fl ? "#fff" : "#8a93a8"; ctx.fillRect(4, -10, 1, 11); // a blade
  if (e.hp < e.maxHp) { ctx.fillStyle = "#000"; ctx.fillRect(-5, -16, 10, 2); ctx.fillStyle = "#e8556b"; ctx.fillRect(-5, -16, Math.round(10 * clamp(e.hp / e.maxHp, 0, 1)), 2); }
  ctx.restore(); }

function pix(t, x, y, c, a) { ctx.fillStyle = c; ctx.font = "8px 'Courier New',monospace"; ctx.textAlign = a || "left"; ctx.textBaseline = "alphabetic"; ctx.fillText(t, Math.round(x), Math.round(y)); ctx.textAlign = "left"; }
function pixBig(t, x, y, c, px, font) { ctx.save(); ctx.fillStyle = c; ctx.font = "bold " + (px || 22) + "px " + (font || "'Georgia',serif"); ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillText(t, x, y); ctx.restore(); }

function drawHUD() {
  if (game.mode !== "play" && game.mode !== "dead") return;
  // essence pill
  ctx.fillStyle = "rgba(10,20,16,0.85)"; rr(8, 8, 90, 12, 3); ctx.fill(); ctx.strokeStyle = "#3a7a5a"; ctx.lineWidth = 1; rr(8.5, 8.5, 89, 11, 3); ctx.stroke();
  ctx.fillStyle = "#8effc0"; ctx.beginPath(); ctx.arc(15, 14, 3, 0, 7); ctx.fill();
  pix("essence  " + Math.floor(player.essence), 22, 17, "#cfeede");
  // coins + day + hp
  pix("coins " + player.coins, VW - 8, 14, "#ffe07a", "right");
  pix("DAY " + player.day, VW - 8, 25, "#e6dabc", "right");
  // hp bar
  ctx.fillStyle = "rgba(10,8,12,0.85)"; rr(8, 23, 90, 8, 2); ctx.fill();
  ctx.fillStyle = "#7a1f2a"; ctx.fillRect(10, 25, 86, 4); ctx.fillStyle = "#e8556b"; ctx.fillRect(10, 25, Math.round(86 * clamp(player.hp / player.maxHp, 0, 1)), 4);
  pix(player.form === "crawler" ? "crawler" : "carrion hound", 10, 30 + 9, "#bca0c0");
  // prompts
  if (game.mode === "play") {
    if (game.formPrompt) pix("[F] FORM A BODY  ·  essence " + Math.floor(player.essence) + "/100", VW / 2, VH - 22, "#9effc0", "center");
    else if (player.form === "crawler") pix("hold [SPACE] over bones to EAT  ·  gather essence", VW / 2, VH - 22, "rgba(207,238,222,0.7)", "center");
    if (enemies.length === 0 && player.day >= 1 && !game.formPrompt) pix("[R] rest  ·  the next day comes (and hunters with it)", VW / 2, VH - 10, "rgba(255,230,160,0.6)", "center");
    else if (enemies.length > 0) pix("hold [SPACE] to BITE  ·  eat the fallen for essence", VW / 2, VH - 10, "rgba(255,150,150,0.7)", "center");
    pix("WASD move", 8, VH - 6, "rgba(220,220,220,0.4)", "left");
  }
  if (game.dayBannerT > 0) { ctx.globalAlpha = clamp(game.dayBannerT, 0, 1); pixBig("DAY " + player.day, VW / 2, 60, "#f2deac", 26); pix("they come for the bounty on your head", VW / 2, 74, "#caa78a", "center"); ctx.globalAlpha = 1; }
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function drawTitle() { ctx.fillStyle = "rgba(8,5,12,0.55)"; ctx.fillRect(0, 0, VW, VH);
  ctx.save(); ctx.shadowColor = "rgba(180,40,40,0.7)"; ctx.shadowBlur = 18; pixBig("CARRION", VW / 2, VH / 2 - 12, "#e8d0c0", 40); ctx.restore();
  pix("you are what the dead leave behind", VW / 2, VH / 2 + 6, "#bca0a0", "center");
  pix("press any key to wake", VW / 2, VH / 2 + 26, "rgba(255,220,160," + (0.5 + Math.sin(game.t * 4) * 0.3) + ")", "center"); }
function drawIntro() { ctx.fillStyle = "rgba(8,5,12,0.7)"; ctx.fillRect(0, 0, VW, VH);
  const lines = ["A flower field. A still pond. And the bones of the dead.", "", "Their deaths seeped into the earth, and the earth made... you.", "A small, hungry thing, crawling in the reeds.", "", "Eat the bones. Gather their essence. Build yourself a body.", "Then nothing that comes for you will leave."];
  let y = 70; for (const l of lines) { pix(l, VW / 2, y, "#d8c8d0", "center"); y += 13; }
  pix("press any key", VW / 2, VH - 24, "rgba(255,220,160," + (0.5 + Math.sin(game.t * 4) * 0.3) + ")", "center"); }
function drawDead() { ctx.fillStyle = "rgba(20,6,10,0.8)"; ctx.fillRect(0, 0, VW, VH); pixBig("CUT DOWN", VW / 2, VH / 2 - 6, "#e8556b", 26); pix("the dead reclaim the dead", VW / 2, VH / 2 + 10, "#caa", "center");
  pix("press any key", VW / 2, VH / 2 + 28, "#ffd86b", "center"); }
addEventListener("keydown", e => { if (game.mode === "dead") reset(); });

let last = performance.now();
function loop(now) { let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1; update(dt); render(); requestAnimationFrame(loop); }
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
