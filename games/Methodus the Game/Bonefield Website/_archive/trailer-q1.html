<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BONEFIELD — teaser, first quarter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Grenze+Gotisch:wght@500;700;900&family=UnifrakturCook:wght@700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;font-family:'EB Garamond',serif;color:#ece3d0}
  .stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  /* fade-from-black + crossfade veil */
  .veil{position:absolute;inset:0;background:#000;pointer-events:none;transition:opacity .6s ease;opacity:1;z-index:5}
  /* persistent HUD */
  .hud{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .8s}
  .hud.on{opacity:1}
  .bars{position:absolute;top:20px;left:22px;width:190px;font-family:'Grenze Gotisch',serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#cdbd96}
  .bar{height:7px;border:1px solid rgba(201,162,74,.5);border-radius:4px;margin:3px 0 8px;overflow:hidden;background:rgba(0,0,0,.35)}
  .bar i{display:block;height:100%}
  .bar.hp i{width:100%;background:#9c2f3b} .bar.st i{width:100%;background:#3a7d5a} .bar.es i{width:78%;background:#3a5a9c}
  .rank{position:absolute;top:20px;right:24px;font-family:'UnifrakturCook',serif;font-size:30px;color:#e6cd8e;text-shadow:0 2px 6px #000}
  .rank small{display:block;font-family:'Grenze Gotisch',serif;font-size:9px;letter-spacing:.2em;color:#8a7c63;text-align:right;text-transform:uppercase}
  .reticle{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:1.5px solid rgba(230,205,142,.7);border-radius:50%;box-shadow:0 0 8px rgba(0,0,0,.6)}
  .hint{position:absolute;bottom:18px;right:22px;font-family:'Grenze Gotisch',serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8a7c63}
  /* tier ladder */
  .ladder{position:absolute;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column-reverse;gap:7px;opacity:0;transition:opacity .5s;z-index:7}
  .ladder.on{opacity:1}
  .rung{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .rung b{font-family:'UnifrakturCook',serif;font-size:18px;width:26px;text-align:center;color:#5a4a2a;transition:.25s}
  .rung i{width:46px;height:8px;border:1px solid rgba(201,162,74,.5);border-radius:3px;background:rgba(0,0,0,.4);transition:.25s}
  .rung.lit b{color:#f3e2ac;text-shadow:0 0 10px rgba(201,162,74,.8)} .rung.lit i{background:linear-gradient(90deg,#caa24a,#f3e2ac);box-shadow:0 0 10px rgba(201,162,74,.7)}
  .rung.locked{opacity:.4}
  .powlbl{position:absolute;right:30px;top:calc(50% + 130px);font-family:'Grenze Gotisch',serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#e6cd8e;opacity:0;transition:.4s;z-index:7}
  .powlbl.on{opacity:1}
  /* chant text beside player + captions */
  .chant{position:absolute;left:50%;bottom:26%;transform:translateX(-50%);font-family:'Grenze Gotisch',serif;font-weight:700;font-size:clamp(18px,2.4vw,28px);letter-spacing:.02em;color:#f0dca0;text-shadow:0 2px 10px #000,0 0 18px rgba(201,162,74,.5);opacity:0;transition:opacity .4s;z-index:8;text-align:center;max-width:80%}
  .chant.on{opacity:1}
  .cap{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-style:italic;font-size:clamp(16px,2.2vw,22px);color:#ece3d0;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .5s;z-index:8;text-align:center;max-width:84%}
  .cap.on{opacity:1}
  /* start + end */
  .start{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(700px 420px at 50% 45%,#1a130a,#000 75%);cursor:pointer}
  .start h1{font-family:'UnifrakturCook',serif;font-size:clamp(48px,9vw,104px);margin:0;background:linear-gradient(180deg,#f3e2ac,#caa24a 55%,#7c5d2b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .start .play{margin-top:16px;font-family:'Grenze Gotisch',serif;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:#e6cd8e;border:1px solid #a9813f;border-radius:30px;padding:11px 24px}
  .start .note{margin-top:14px;font-style:italic;color:#8a7c63;font-size:13px}
  .endcard{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(700px 420px at 50% 45%,#1a130a,#000 78%)}
  .endcard.on{display:flex}
  .endcard h1{font-family:'UnifrakturCook',serif;font-size:clamp(54px,10vw,120px);margin:0;background:linear-gradient(180deg,#f3e2ac,#caa24a 55%,#7c5d2b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .endcard .tag{margin-top:10px;font-family:'Grenze Gotisch',serif;letter-spacing:.36em;text-transform:uppercase;font-size:13px;color:#c19a4e}
  .endcard .q{margin-top:6px;font-style:italic;color:#8a7c63;font-size:13px}
</style>
</head>
<body>
<div class="stage">
  <video id="v" playsinline></video>
  <div class="veil" id="veil"></div>

  <div class="hud" id="hud">
    <div class="bars"><span>Vitality</span><div class="bar hp"><i></i></div><span>Stamina</span><div class="bar st"><i></i></div><span>Essence</span><div class="bar es"><i></i></div></div>
    <div class="rank">D<small>Bounty</small></div>
    <div class="reticle"></div>
    <div class="hint">E cast · hold L charge · R parry</div>
  </div>

  <div class="ladder" id="ladder">
    <div class="rung locked" data-r="L"><b>L</b><i></i></div>
    <div class="rung locked" data-r="S"><b>S</b><i></i></div>
    <div class="rung locked" data-r="A"><b>A</b><i></i></div>
    <div class="rung" data-r="B"><b>B</b><i></i></div>
    <div class="rung" data-r="C"><b>C</b><i></i></div>
    <div class="rung" data-r="D"><b>D</b><i></i></div>
  </div>
  <div class="powlbl" id="powlbl">Fire power · tier —</div>

  <div class="chant" id="chant"></div>
  <div class="cap" id="cap"></div>

  <div class="start" id="start">
    <h1>Bonefield</h1>
    <div class="play">▶ Play the first quarter</div>
    <div class="note">~15s · concept gameplay · sound on</div>
  </div>
  <div class="endcard" id="end">
    <h1>Bonefield</h1>
    <div class="tag">❖ &nbsp; Speak · Combine · Unleash &nbsp; ❖</div>
    <div class="q">first quarter · the rest comes next</div>
  </div>
</div>

<script>
const PLAYLIST = [
  { src:'gp-walk.mp4?v=1', cap:'In this world, you can be anything.', hud:true },
  { src:'q2-cast.mp4?v=1', chant:'"Spirits of fire, hear me…"', cap:'They only fear what you say.', hud:true },
  { src:'q3-charge.mp4?v=1', chant:'"…bring ruin to all who defy me, and burn…"', cap:'Hold to build power. Spells have tiers.', hud:true, tiers:true },
];
const v=document.getElementById('v'), veil=document.getElementById('veil'), hud=document.getElementById('hud'),
  ladder=document.getElementById('ladder'), powlbl=document.getElementById('powlbl'),
  chant=document.getElementById('chant'), cap=document.getElementById('cap'),
  start=document.getElementById('start'), end=document.getElementById('end');
let i=-1;
function setRungs(state){ // state: 'reset' | 'D' | 'C' | 'B'
  const order=['D','C','B']; const upto=order.indexOf(state);
  document.querySelectorAll('.ladder .rung').forEach(r=>{ const k=r.dataset.r; if(order.includes(k)){ r.classList.toggle('lit', order.indexOf(k)<=upto && upto>=0);} });
}
function play(n){
  i=n; const c=PLAYLIST[n];
  veil.style.opacity='1';
  chant.classList.remove('on'); cap.classList.remove('on'); ladder.classList.remove('on'); powlbl.classList.remove('on'); setRungs('reset');
  v.src=c.src;
  v.play().catch(()=>{});
  setTimeout(()=>{ veil.style.opacity='0'; hud.classList.toggle('on', !!c.hud); }, 80);
  // cue overlays
  setTimeout(()=>{ if(c.chant){chant.textContent=c.chant; chant.classList.add('on');} }, 700);
  setTimeout(()=>{ if(c.cap){cap.textContent=c.cap; cap.classList.add('on');} }, c.chant?2200:1200);
  if(c.tiers){ ladder.classList.add('on'); powlbl.classList.add('on'); }
}
v.addEventListener('timeupdate', ()=>{
  const c=PLAYLIST[i]; if(!c||!c.tiers)return; const t=v.currentTime;
  if(t>3.6){setRungs('B'); powlbl.textContent='Fire power · tier B';}
  else if(t>2.0){setRungs('C'); powlbl.textContent='Fire power · tier C';}
  else if(t>0.6){setRungs('D'); powlbl.textContent='Fire power · tier D';}
});
v.addEventListener('ended', ()=>{
  if(i<PLAYLIST.length-1){ play(i+1); }
  else { veil.style.opacity='1'; setTimeout(()=>{ hud.classList.remove('on'); ladder.classList.remove('on'); powlbl.classList.remove('on'); chant.classList.remove('on'); cap.classList.remove('on'); end.classList.add('on'); }, 500); }
});
start.addEventListener('click', ()=>{ start.style.display='none'; play(0); });
</script>
</body>
</html>
