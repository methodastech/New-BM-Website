<!doctype html>
<html><head><meta charset="utf-8"><title>extract</title></head>
<body style="margin:0;background:#000">
<video id="v" muted playsinline preload="auto" style="width:480px;display:block"></video>
<canvas id="c" width="1280" height="720" style="display:none"></canvas>
<script>
window.__st='init'; window.__b64=null; window.__dur=0; window.__err=null;
const v=document.getElementById('v'), c=document.getElementById('c');
function draw(tag){
  try{
    c.getContext('2d').drawImage(v,0,0,1280,720);
    window.__b64=c.toDataURL('image/jpeg',0.92).split(',')[1];
    window.__st='done:'+tag+'@'+v.currentTime.toFixed(2);
  }catch(e){ window.__err=String(e); window.__st='drawerr'; }
}
let tries=0;
function trySeek(){
  const tgt=Math.max(0, v.duration - 0.10 - tries*0.25);
  v.currentTime=tgt;
}
v.addEventListener('loadedmetadata',()=>{ window.__dur=v.duration; window.__st='meta:'+v.duration.toFixed(2); trySeek(); });
v.addEventListener('seeked',()=>{
  if(v.currentTime < 1 && tries < 8){ tries++; window.__st='retry'+tries; setTimeout(trySeek,120); return; }
  window.__st='seeked@'+v.currentTime.toFixed(2); draw('seeked');
});
v.addEventListener('error',()=>{ window.__err='video error '+(v.error&&v.error.code); window.__st='vaderr'; });
// Load the whole file as a blob so the end is fully seekable.
fetch('continuous-hook.mp4?v=1').then(r=>r.blob()).then(b=>{
  window.__st='blob:'+b.size; v.src=URL.createObjectURL(b);
}).catch(e=>{ window.__err='fetch '+String(e); window.__st='fetcherr'; });
</script>
</body></html>
