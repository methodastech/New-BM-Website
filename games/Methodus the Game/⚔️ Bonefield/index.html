/* Equipment (Loop Hero-style pixel UI): paper-doll slots + inventory grid. */
function unequip(slot) {
  const cur = state.equipment[slot]; if (!cur) return;
  applyItemStats(cur, -1); state.inventory.push(cur); state.equipment[slot] = null;
  beep(360, 0.06, "square");
}
function drawEquip() {
  dim(0.82);
  const cx = VIEW.w / 2, cy = VIEW.h / 2;
  const pw = 600, ph = 444, px = cx - pw / 2, py = cy - ph / 2;
  pixelPanel(px, py, pw, ph, GOLD);
  ptext("EQUIPMENT", cx, py + 22, 4, GOLD, "center");
  const p = state.player;

  // hero portrait panel
  pixelPanel(px + 30, py + 70, 110, 170, "#3a3550");
  drawSprite(PLAYER_IDLE[0], px + 85, py + 158, 0, false, 5);

  // equip slots
  const ss = 64, wx = px + 168, wy = py + 84, ax = px + 168, ay = py + 84 + ss + 30;
  setFont(12, "bold", FONT_BODY); ctx.fillStyle = GOLD;
  ctx.fillText("WEAPON", wx, wy - 8);
  pixelSlot(wx, wy, ss, state.equipment.weapon, state.equipment.weapon ? () => unequip("weapon") : null, false);
  ctx.fillStyle = "#f4ecd8"; setFont(14, "bold", FONT_BODY);
  ctx.fillText(state.equipment.weapon ? ITEMS[state.equipment.weapon].name : "(empty)", wx + ss + 14, wy + 26);
  ctx.fillStyle = "#9a92b0"; setFont(11, "", FONT_BODY);
  if (state.equipment.weapon) ctx.fillText(itemStatLines(ITEMS[state.equipment.weapon]).join("   "), wx + ss + 14, wy + 44);

  ctx.fillStyle = GOLD; setFont(12, "bold", FONT_BODY);
  ctx.fillText("CLOTHING", ax, ay - 8);
  pixelSlot(ax, ay, ss, state.equipment.armor, state.equipment.armor ? () => unequip("armor") : null, false);
  ctx.fillStyle = "#f4ecd8"; setFont(14, "bold", FONT_BODY);
  ctx.fillText(state.equipment.armor ? ITEMS[state.equipment.armor].name : "(empty)", ax + ss + 14, ay + 26);
  ctx.fillStyle = "#9a92b0"; setFont(11, "", FONT_BODY);
  if (state.equipment.armor) ctx.fillText(itemStatLines(ITEMS[state.equipment.armor]).join("   "), ax + ss + 14, ay + 44);

  // inventory grid
  ctx.fillStyle = "#9a92b0"; setFont(12, "bold", FONT_BODY);
  ctx.fillText("INVENTORY  ·  click to equip", px + 378, py + 80);
  const cols = 4, cell = 54, gap = 8, gx = px + 378, gy = py + 92;
  if (!state.inventory.length) { ctx.fillStyle = "#5a5570"; setFont(12, "italic", FONT_BODY); ctx.fillText("empty — defeat bosses for loot", gx, gy + 24); }
  state.inventory.forEach((id, i) => {
    const c = i % cols, r = (i / cols) | 0;
    pixelSlot(gx + c * (cell + gap), gy + r * (cell + gap), cell, id, () => equipItem(id), false);
  });

  // stat summary
  const sw = CONFIG.sword, sy = py + ph - 90;
  ctx.fillStyle = "#ccc6b6"; setFont(13, "", FONT_BODY);
  ctx.fillText("Sword damage  " + (sw.damage + p.swordDamageBonus) + "      Reach  " + (sw.range + p.swordRangeBonus), px + 32, sy);
  ctx.fillText("Max HP  " + Math.round(p.maxHp) + "      Damage taken  -" + Math.round(p.armorReduction * 100) + "%", px + 32, sy + 22);

  // pixel close button
  uiButton("CLOSE  (I)", cx - 85, py + ph - 50, 170, 36, GOLD, closeEquip);
}

}

function dim(a) { ctx.fillStyle = "rgba(5,5,10," + a + ")"; ctx.fillRect(0, 0, VIEW.w, VIEW.h); }

function render() {
  state.uiButtons = []; // clickable rects are rebuilt every frame
  if (state.player) updateCamera();
  else { cam.x = WORLD.w / 2; cam.y = WORLD.h / 2; }
  ctx.save();
  // camera: centre on the player, zoom out, with screen shake
  ctx.translate(VIEW.w / 2, VIEW.h / 2);
  if (state.shake > 0) ctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));
  ctx.scale(CONFIG.art.zoom, CONFIG.art.zoom);
  ctx.translate(-cam.x, -cam.y);
  drawBackground();
  if (state.player) drawWorld();
  ctx.restore();

  if (state.mode === "start") drawStart();
  else if (state.mode === "codex") drawCodex();
  else if (state.mode === "bestiary") drawBestiary();
  else if (state.mode === "dead") drawDeath();
  else {
    drawHUD();
    if (state.mode === "levelup") drawLevelUp();
    else if (state.mode === "ritual") drawRitual();
    else if (state.mode === "paused") drawPaused();
    else if (state.mode === "recruit") drawRecruit();
    else if (state.mode === "equip") drawEquip();
  }
}

/* =====================================================================
   13. GAME LOOP : fixed timestep updates, render each frame
   ===================================================================== */
const STEP = 1 / 60;
let acc = 0, last = performance.now();

function loop(now) {
  let frame = (now - last) / 1000;
  last = now;
  if (frame > 0.25) frame = 0.25; // avoid spiral after tab switch
  acc += frame;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  // music swells on the battlefield, softens on menus, surges for the boss
  MUSIC.target = (state.mode === "start" || state.mode === "dead" || state.mode === "codex") ? 0.3 : 1;
  MUSIC.boss = !!(state.boss && !state.boss.ally && state.mode === "playing");
  musicTick();
  requestAnimationFrame(loop);
}

state = freshState();
requestAnimationFrame(loop);
