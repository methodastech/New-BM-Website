/* =====================================================================
   BONEYARD : a knight at the centre of a large field. Summon skeletons
   (costs mana), sweep with the sword, dash to dodge, and RIGHT-CLICK a
   force-push that flings enemies with real momentum. Enemies swarm from
   all sides; casters shoot from afar. Camera follows. Original code + art.
   ===================================================================== */

let VW = 384, VH = 216;                     // viewport (camera window) — recomputed responsively
const WORLD = { w: 880, h: 560 };           // big field; player roams, camera follows
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let scale = 1;
function resize() {
  const base = Math.max(2, Math.floor(innerHeight / 236)), zoom = 1.3;   // show ~30% more of the field
  VW = Math.min(WORLD.w, Math.round(innerWidth / base * zoom));
  VH = Math.min(WORLD.h, Math.round(innerHeight / base * zoom));
  cv.width = VW; cv.height = VH; ctx.imageSmoothingEnabled = false;
  scale = innerWidth / VW;                                      // VW/VH already track the window aspect, so fill the window exactly — no letterbox bars
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  cv.style.left = "0px"; cv.style.top = "0px";
}
addEventListener("resize", resize); resize();

const rnd = (a, b) => a + Math.random() * (b - a);
const hsh = (ix, iy) => { let n = (ix * 374761393 + iy * 668265263) | 0; n = (n ^ (n >> 13)) * 1274126177 | 0; return ((n ^ (n >> 16)) >>> 0) / 4294967296; };   // stable per-cell noise (no shimmer): unifies water/grass texture
const seedIdx = (n, len) => { n = (Math.abs(n | 0) * 2654435761) >>> 0; n ^= n >>> 15; n = (n * 2246822519) >>> 0; n ^= n >>> 13; return (n >>> 0) % len; };   // a UNIFORM index 0..len-1 from a seed (hsh is range-limited, no good for picking from a list)
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hyp = (x, y) => Math.hypot(x, y);
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

function spr(grid, cx, cy, sc, flip, flash, pal) {
  sc = sc || 1; const h = grid.length, w = grid[0].length;
  const ox = Math.round(cx - (w * sc) / 2), oy = Math.round(cy - (h * sc) / 2);
  for (let r = 0; r < h; r++) { const row = grid[r];
    for (let c = 0; c < w; c++) { const ch = flip ? row[w - 1 - c] : row[c]; const col = (pal && pal[ch]) || PAL[ch];   // pal remaps chars (armour look / faction tint)
      if (!col) continue; ctx.fillStyle = flash ? "#ffffff" : col; ctx.fillRect(ox + c * sc, oy + r * sc, sc, sc); } }
}

/* ============================================================================
   OPTIONAL ART-PACK LAYER  ·  drop authored sprite sheets in to lift the look
   ----------------------------------------------------------------------------
   The built-in units are code-drawn pixel sprites (above). For a hand-pixel
   tier (Loop Hero etc.) you need authored sprite SHEETS (PNG image files).
   This layer is PURELY ADDITIVE: with no image files present, every unit
   falls back to its built-in sprite and nothing changes.

   To add a pack:
     1. Put PNG sheets next to index.html, e.g.  ./art/warrior.png
        A sheet is a grid of frames: columns = animation frames, rows = states.
     2. Describe each in SPRITE_SHEETS below (uncomment / add entries).
     3. Reload. Units with a loaded sheet render from it automatically.

   A sheet entry:
     key: {
       src: "art/warrior.png",  // path relative to index.html
       fw: 32, fh: 32,          // one frame's width / height in pixels
       anchorY: 28,             // y inside a frame that meets the ground (the feet)
       dirs: 1,                 // 1 = one facing (mirror for left); 2 = separate L row
       anims: {                 // state -> { row, frames, fps[, rowL for dirs:2] }
         idle: { row: 0, frames: 2, fps: 3 },
         walk: { row: 1, frames: 4, fps: 9 },
       },
     }
   Keys map to unit kinds: "necromancer" (the player) + each foe kind
   (warrior, hunter, soldier, spearman, knight, mage, rogue, assassin,
    commander, champion, berserker) and "skeleton" (your summons).
   ============================================================================ */
const SPRITE_SHEETS = {
  // The player is the creature you have become : a teal ectoplasm SLIME (idle breathe + hop), authored pixel art.
  necromancer: { src: "art/slime.png", fw: 42, fh: 32, anchorY: 29, dirs: 1, anims: {
    idle: { row: 0, frames: 2, fps: 3 }, walk: { row: 1, frames: 4, fps: 6 } } },   // translucent jelly (Higgsfield -> pixelized), slow soft hop
  // warrior:     { src: "art/warrior.png",     fw: 32, fh: 32, anchorY: 28, dirs: 1, anims: { idle: { row: 0, frames: 2, fps: 3 }, walk: { row: 1, frames: 4, fps: 9 } } },
};
function loadSheets() {   // kick off async image loads; failures fall back silently
  for (const k in SPRITE_SHEETS) { const s = SPRITE_SHEETS[k]; if (!s || s._tried) continue; s._tried = true;
    if (!s.src) continue; const img = new Image(); img.onload = () => { s.img = img; s.ok = true; }; img.onerror = () => { s.ok = false; }; img.src = s.src; }
}
function sheetReady(key) { const s = SPRITE_SHEETS[key]; return !!(s && s.ok && s.img); }
function drawSheet(key, cx, cy, sc, flip, state, animT) {   // draw the right frame from a loaded sheet; returns false if unavailable
  const s = SPRITE_SHEETS[key]; if (!s || !s.ok || !s.img) return false;
  const anim = (s.anims && (s.anims[state] || s.anims.idle)) || (s.anims && Object.values(s.anims)[0]); if (!anim) return false;
  const fr = Math.floor((animT || 0) * (anim.fps || 6)) % (anim.frames || 1);
  let row = anim.row || 0, doFlip = flip;
  if (s.dirs === 2 && flip) { row = (anim.rowL != null ? anim.rowL : row + 1); doFlip = false; }   // a 2-direction sheet has a dedicated left row
  const sxp = fr * s.fw, syp = row * s.fh, dw = s.fw * sc, dh = s.fh * sc;
  const dx = Math.round(cx - dw / 2), dy = Math.round(cy - (s.anchorY != null ? s.anchorY : s.fh) * sc);
  if (doFlip) { ctx.save(); ctx.translate(dx + dw, dy); ctx.scale(-1, 1); ctx.drawImage(s.img, sxp, syp, s.fw, s.fh, 0, 0, dw, dh); ctx.restore(); }
  else ctx.drawImage(s.img, sxp, syp, s.fw, s.fh, dx, dy, dw, dh);
  return true;
}
// draw a unit: prefer its authored sheet, otherwise the built-in pixel sprite (flash/pal apply to the fallback)
function unitSpr(key, grid, cx, cy, sc, flip, flash, pal, state, animT) {
  if (sheetReady(key) && drawSheet(key, cx, cy, sc, flip, state, animT)) return;
  spr(grid, cx, cy, sc, flip, flash, pal);
}

  R(-3, 1, 6, 5, "#c0394a"); R(-3, 1, 6, 1, "#d85060"); R(-1, 1, 2, 5, "#ffd86b"); R(-3, 3, 6, 1, "#ffd86b"); R(-2, 0, 2, 1, "#ffe6a0"); R(0, 0, 2, 1, "#ffe6a0");   // the present
}
function drawGift() {
  ctx.fillStyle = "rgba(6,5,10,0.9)"; ctx.fillRect(0, 0, VW, VH); game.btns = [];
  const cx = VW / 2, pw = Math.round(Math.min(VW * 0.72, 470)), ph = 152, px = cx - pw / 2, py = (VH - ph) / 2 - 4;

    pix("a small wrapped box in her hands.", tx, py + 45, "#d8c8e8", "left");

    pix(' Here... a little gift. Go on, take it."', tx, py + 74, "#f4d4ec", "left");
    const bw = 100, gap = 16, bxs = tx + 30 - bw, ab = { x: bxs, y: py + ph - 30, w: bw, h: 18, act: "accept", l: "ACCEPT  +100" }, rb = { x: bxs + bw + gap, y: py + ph - 30, w: bw, h: 18, act: "reject", l: "REFUSE" };
    tabBtn(ab, false); tabBtn(rb, false); game.btns.push(ab, rb);
  } else {
    wrapPix('"' + (g.line || "") + '"', tx + 55, py + 56, 36, "#f4d4ec");

function drawDead() { ctx.fillStyle = "rgba(8,6,10,0.82)"; ctx.fillRect(0, 0, VW, VH); pix("THE POOL IS BREACHED", VW / 2, VH / 2 - 8, "#e8556b", "center"); pix("you held until day " + game.floor, VW / 2, VH / 2 + 6, "#fff", "center"); pix("click or press a key to rise again", VW / 2, VH / 2 + 22, "#ffd86b", "center"); }
function drawVictory() { ctx.fillStyle = "rgba(6,10,8,0.82)"; ctx.fillRect(0, 0, VW, VH); pix("THE POOL IS YOURS", VW / 2, VH / 2 - 10, "#9effc0", "center"); pix("all " + game.maxFloor + " days held  ·  LV " + player.level + "  ·  " + player.gold + "g", VW / 2, VH / 2 + 6, "#fff", "center"); pix("click or press a key to return", VW / 2, VH / 2 + 22, "#ffd86b", "center"); }
// each LEVEL is its own world : a name + a colour grade that reskins the whole field
const DEPTHS = [null,
  { name: "The Flower Field",    col: "#9effc0", grade: null },                                                                              // 1 : bright, lush — the natural look
  { name: "The Dusk Reaches",    col: "#ffb27a", grade: { mul: "rgba(255,138,48,0.34)", top: "rgba(120,50,10,0.08)", bot: "rgba(140,55,15,0.40)" } },   // 2 : amber dusk
  { name: "The Twilight Hollow", col: "#b9a8ff", grade: { mul: "rgba(110,98,210,0.36)", top: "rgba(30,24,72,0.20)", bot: "rgba(18,14,58,0.50)" } },     // 3 : blue-violet twilight
  { name: "The Sunless Deep",    col: "#ff7a8a", grade: { mul: "rgba(176,38,56,0.40)", top: "rgba(46,8,28,0.32)", bot: "rgba(66,8,30,0.58)" } },         // 4 : crimson deep
];
function drawDepthGrade() {   // tint + darken the whole scene to the current level's mood (under the HUD)
  const D = DEPTHS[game.depth || 1]; if (!D || !D.grade) return; const g = D.grade;
  if (g.mul) { ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = g.mul; ctx.fillRect(0, 0, VW, VH); ctx.restore(); }
  const grad = ctx.createLinearGradient(0, 0, 0, VH); grad.addColorStop(0, g.top || "rgba(0,0,0,0)"); grad.addColorStop(1, g.bot || "rgba(0,0,0,0)");
  ctx.fillStyle = grad; ctx.fillRect(0, 0, VW, VH);
}
function drawDayTitle() {   // a cinematic "DAY N" card at the top before each day begins
  const bt = game.bannerT, a = Math.min(clamp((4.0 - bt) / 0.5, 0, 1), clamp(bt, 0, 1));   // fade in over 0.5s, hold, fade out over the last 1s
  if (a <= 0) return;
  const cx = VW / 2, ty = 54;
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.shadowColor = "rgba(202,167,90,0.85)"; ctx.shadowBlur = 14; ctx.fillStyle = "#f2deac"; ctx.font = "bold 26px 'Georgia',serif"; ctx.fillText("DAY " + game.floor, cx, ty); ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(202,167,90,0.7)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx - 74, ty + 7); ctx.lineTo(cx + 74, ty + 7); ctx.stroke();
  ctx.fillStyle = "#caa75a"; ctx.beginPath(); ctx.moveTo(cx, ty + 4); ctx.lineTo(cx + 4, ty + 7); ctx.lineTo(cx, ty + 10); ctx.lineTo(cx - 4, ty + 7); ctx.closePath(); ctx.fill();
  ctx.font = "italic 13px 'Georgia',serif"; ctx.fillStyle = game.dayBoss ? "#ff9a8a" : "#e6dabc"; ctx.fillText(game.dayName || "", cx, ty + 23);
  const D = DEPTHS[game.depth || 1]; if (D) pix("LEVEL " + (game.depth || 1) + "  ·  " + D.name, cx, ty + 35, D.col, "center");
  let by = ty + 49;
  if (game.dayBoss) { pix("★ BOSS ★", cx, by, "#ff9a8a", "center"); by += 12; }
  else if (game.twist) { pix(game.twist, cx, by, "#caa78a", "center"); by += 11; }
  if (game.situation) { pix(game.situation, cx, by, "#9aa6b6", "center"); by += 10; }
  if (game.encounterMod) { pix("⚠ " + game.encounterMod + ": " + (game.encounterHint || ""), cx, by, "#ff9a6a", "center"); by += 11; }
  if (game.bannerText) pix(game.bannerText, cx, by, "#ffd86b", "center");
  ctx.restore();
}
function drawPaused() {
  ctx.fillStyle = "rgba(8,8,14,0.8)"; ctx.fillRect(0, 0, VW, VH); game.btns = []; const cx = VW / 2;
  if (game.pauseConfirm) {
    pix("END THIS RUN?", cx, VH / 2 - 22, "#ff9a8a", "center");
    pix("the day is lost and you return to the menu", cx, VH / 2 - 9, "#bcd0e6", "center");
    const yb = { x: cx - 104, y: VH / 2 + 8, w: 96, h: 18, act: "quityes", l: "YES, END" }, nb = { x: cx + 8, y: VH / 2 + 8, w: 96, h: 18, act: "quitno", l: "NO, RESUME" };
    tabBtn(yb, false); tabBtn(nb, false); game.btns.push(yb, nb);
  } else {
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.shadowColor = "rgba(202,167,90,0.7)"; ctx.shadowBlur = 12; ctx.fillStyle = "#ecd9a4"; ctx.font = "bold 26px 'Georgia',serif"; ctx.fillText("PAUSED", cx, VH / 2 - 16); ctx.restore();
    const rb = { x: cx - 104, y: VH / 2 + 2, w: 96, h: 18, act: "resume", l: "RESUME  (P)" }, qb = { x: cx + 8, y: VH / 2 + 2, w: 96, h: 18, act: "quit", l: "END RUN  (Esc)" };
    tabBtn(rb, false); tabBtn(qb, false); game.btns.push(rb, qb);
    pix("P to resume", cx, VH / 2 + 32, "#8a7e6a", "center");
  }
}

const GRASS_BASE = ["#3c7a33", "#479238", "#54a83f"], GRASS_TIP = ["#7ac84e", "#8ad65a", "#9be36a"];
function drawFoliage() {   // GRASS layer : crisp 2-tone tufts, swayed by a travelling wind gust, parted by the character
  if (!foliage || !foliage.length) return;
  const t = game.time, gust = fieldWind.a;
  for (const f of foliage) {
    const wave = Math.sin(t * 1.5 - f.x * 0.022 + f.y * 0.012 + f.phase) * 0.62 + Math.sin(t * 3.0 + f.phase) * 0.38;
    let bend = (wave * (0.7 + gust) + f.lean) * (f.h * 0.95);
    const dx = f.x - player.x, dy = f.y - player.y, d2 = dx * dx + dy * dy;     // the character parts the grass, harder on a dash
    if (d2 < 460) { const d = Math.sqrt(d2) || 1; bend += (dx / d) * (1 - d / 21.5) * (6 + (player.dashT > 0 ? 11 : 0)); }
    const bx = Math.round(f.x), by = Math.round(f.y), cb = GRASS_BASE[f.g], ct = GRASS_TIP[f.g];
    for (let k = -1; k <= 1; k++) {
      const topX = Math.round(f.x + bend + k * 1.3), topY = Math.round(f.y - f.h - (k === 0 ? 1 : 0));
      ctx.strokeStyle = cb; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx + k, by); ctx.lineTo(topX, topY); ctx.stroke();
      ctx.fillStyle = ct; ctx.fillRect(topX, topY, 1, 1);                       // sunlit blade tip
    }
  }
}
function drawPetals() {   // wind-borne petals drifting over the field
  if (!petals || !petals.length) return;
  for (const p of petals) { const a = clamp(p.life / 1.4, 0, 1); ctx.globalAlpha = 0.45 + 0.4 * a; ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 1 + (Math.floor(p.sw) % 2)); }
  ctx.globalAlpha = 1;
}
function render() {
  ctx.fillStyle = "#13121d"; ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  let sx = 0, sy = 0; if (game.shake > 0) { sx = Math.round(rnd(-game.shake, game.shake)); sy = Math.round(rnd(-game.shake, game.shake)); }
  ctx.translate(Math.round(-cam.x + VW / 2) + sx, Math.round(-cam.y + VH / 2) + sy);
  drawBgWorld(); drawFoliage(); drawWorld(); drawPetals(); drawLightingWorld(); ctx.restore();
  drawAtmosphere();
  if (game.mode === "play" || game.mode === "intro" || game.mode === "paused" || game.mode === "cleared" || game.mode === "dying") drawDepthGrade();   // the level's colour grade reskins the field
  if (game.mode === "play" && player.hurt > 0) { ctx.fillStyle = "rgba(190,30,30," + (player.hurt * 1.6) + ")"; ctx.fillRect(0, 0, VW, VH); }   // red sting when you take a hit
  if ((game.mode === "play" || game.mode === "paused" || game.mode === "intro") && game.bannerT > 0) drawDayTitle();
  if (game.mode === "intro") { pix("MOVE : advance on them  ·  CLICK : ambush  ·  key : hear them out", VW / 2, VH - 16, "rgba(255,225,160," + (0.45 + Math.sin(game.time * 5) * 0.25) + ")", "center"); }
  if (game.mode === "cleared") { ctx.fillStyle = "rgba(8,10,16," + clamp((3 - game.clearT) * 0.3, 0, 0.55) + ")"; ctx.fillRect(0, 0, VW, VH); pix("THE FIELD FALLS STILL", VW / 2, VH / 2 - 8, "#cfe0ff", "center"); pix("it's over, you trudge to the pond to rest", VW / 2, VH / 2 + 6, "#9aa0ad", "center"); }
  if (!game.sandbox) drawHUD();   // Level 0 : clean view, just the slime + the field
  if (game.mode === "menu") drawMenu(); else if (game.mode === "info") drawInfo(); else if (game.mode === "reward") drawReward(); else if (game.mode === "dead") drawDead(); else if (game.mode === "victory") drawVictory(); else if (game.mode === "paused") drawPaused(); else if (game.mode === "gear") drawGear(); else if (game.mode === "gift") drawGift();
}
const STEP = 1 / 60; let acc = 0, last = performance.now();
function loop(now) { let dt = (now - last) / 1000; last = now; if (dt > 0.25) dt = 0.25;
  if (game.hitStop > 0) game.hitStop -= dt; else { acc += dt; while (acc >= STEP) { update(STEP); acc -= STEP; } }
  pickMusic(); render(); musicTick(); requestAnimationFrame(loop); }
loadSheets(); SANDBOX = true; reset(); requestAnimationFrame(loop);   // boot straight into the bare Level 0 : the slime + the flower field, nothing else
</script>
